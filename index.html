<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WEURA AI — Think Beyond.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030712;
            --bg-surface: #0b0f19;
            --bg-sidebar: #060913;
            --bg-card: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --font-main: 'Outfit', sans-serif;
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --bg-sidebar: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.9);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-blue: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #030712;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-logo-container {
            position: relative;
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .splash-ring {
            position: absolute;
            inset: 0;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            animation: pulse-ring 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        .splash-ring:nth-child(2) {
            inset: -12px;
            animation-delay: 0.5s;
            border-color: rgba(59, 130, 246, 0.15);
        }
        .w-circle {
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
            font-weight: 700;
            font-size: 28px;
            color: #030712;
        }
        .splash-title {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .splash-subtitle {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 4px;
            color: var(--accent-blue);
            text-transform: uppercase;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.2; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* App Container */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }
        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }
        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-w {
            width: 36px;
            height: 36px;
            background: #ffffff;
            color: #030712;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .brand-name {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .nav-btn {
            width: 100%;
            padding: 12px 16px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-align: left;
        }
        .nav-btn:hover {
            background: var(--bg-card);
            border-color: var(--border-color);
        }
        .nav-btn svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-secondary);
            stroke-width: 2;
            fill: none;
        }
        .nav-btn:hover svg {
            stroke: var(--accent-blue);
        }
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 6px 12px;
            background: var(--bg-card);
            border-radius: 20px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }
        .status-dot.offline {
            background: #ef4444;
        }

        /* Main Workspace */
        .main-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-surface);
            position: relative;
            overflow: hidden;
        }
        .topbar {
            height: 64px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--bg-surface);
            z-index: 10;
        }
        .topbar-left, .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .icon-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            color: var(--text-primary);
        }
        .icon-btn:hover {
            background: var(--bg-card);
            border-color: var(--accent-blue);
        }
        .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .mode-selector {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }
        .welcome-screen {
            margin: auto;
            text-align: center;
            max-width: 600px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .welcome-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .quick-actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }
        .quick-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-align: left;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .quick-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        /* Messages */
        .message {
            display: flex;
            gap: 16px;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
            padding: 16px 0;
            animation: fadeIn 0.3s ease;
        }
        .message.user {
            flex-direction: row-reverse;
        }
        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: 600;
            font-size: 14px;
        }
        .message.ai .msg-avatar {
            background: #ffffff;
            color: #030712;
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .message.user .msg-avatar {
            background: var(--accent-blue);
            color: #ffffff;
        }
        .msg-bubble {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-primary);
            max-width: calc(100% - 60px);
            word-break: break-word;
        }
        .message.user .msg-bubble {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.2);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Composer */
        .composer-container {
            padding: 20px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }
        .composer-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .composer-box:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .composer-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            resize: none;
            max-height: 150px;
            min-height: 24px;
            line-height: 1.5;
            padding: 4px 8px;
        }
        .composer-tools {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 4px;
            border-top: 1px solid var(--border-color);
        }
        .composer-tools-left, .composer-tools-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tool-btn {
            background: transparent;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition-smooth);
        }
        .tool-btn:hover {
            background: var(--bg-surface);
            color: var(--accent-blue);
        }
        .tool-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .send-btn {
            background: var(--accent-blue);
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .send-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
        .send-btn svg {
            width: 18px;
            height: 18px;
            stroke: #ffffff;
            stroke-width: 2;
            fill: none;
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-smooth);
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }
        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }
        .setting-select {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 13px;
        }

        /* Hidden inputs */
        input[type="file"] {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                height: 100%;
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-logo-container">
            <div class="splash-ring"></div>
            <div class="splash-ring"></div>
            <div class="w-circle">W</div>
        </div>
        <div class="splash-title">WEURA AI</div>
        <div class="splash-subtitle">THINK BEYOND.</div>
    </div>

    <!-- App Container -->
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-box">
                    <div class="brand-w">W</div>
                    <span class="brand-name">WEURA AI</span>
                </div>
                <button class="icon-btn" id="close-sidebar-btn" title="Close Sidebar">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="sidebar-content">
                <button class="nav-btn" id="new-chat-btn">
                    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Chat
                </button>
                <div style="margin-top: 12px; font-size: 12px; color: var(--text-secondary); font-weight: 600; padding: 0 4px;">RECENT CHATS</div>
                <div id="chat-history-list" style="display: flex; flex-direction: column; gap: 4px; margin-top: 8px;"></div>
            </div>
            <div class="sidebar-footer">
                <div class="connection-status">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">Connected</span>
                </div>
                <button class="nav-btn" id="settings-open-btn">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Settings
                </button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-workspace">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="icon-btn" id="sidebar-toggle-btn" title="Toggle Sidebar">
                        <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                    <select class="mode-selector" id="mode-selector">
                        <option value="auto">Mode: Auto</option>
                        <option value="smart">Smart</option>
                        <option value="research">Research</option>
                        <option value="code">Code</option>
                        <option value="creative">Creative</option>
                        <option value="vision">Vision</option>
                        <option value="fast">Fast</option>
                    </select>
                </div>
                <div class="topbar-right">
                    <button class="icon-btn" id="search-toggle-btn" title="Toggle Smart Search">
                        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                    <button class="icon-btn" id="theme-toggle-btn" title="Toggle Theme">
                        <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </button>
                </div>
            </header>

            <div class="chat-container" id="chat-container">
                <div class="welcome-screen" id="welcome-screen">
                    <h1 class="welcome-title">WEURA AI</h1>
                    <p class="welcome-subtitle">Think Beyond. What would you like to explore or build today?</p>
                    <div class="quick-actions-grid">
                        <div class="quick-card" data-prompt="Analyze recent architectural trends in AI systems.">⚡ Smart Research</div>
                        <div class="quick-card" data-prompt="Write a robust asynchronous Express API handler.">💻 Code Architecture</div>
                        <div class="quick-card" data-prompt="Explain quantum computing principles simply.">🌌 Quantum Systems</div>
                        <div class="quick-card" data-prompt="Draft a futuristic sci-fi narrative concept.">🚀 Creative Vision</div>
                    </div>
                </div>
            </div>

            <div class="composer-container">
                <div class="composer-box">
                    <textarea class="composer-input" id="composer-input" placeholder="Message WEURA AI..." rows="1"></textarea>
                    <div class="composer-tools">
                        <div class="composer-tools-left">
                            <button class="tool-btn" id="file-upload-btn" title="Upload File">
                                <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                            </button>
                            <button class="tool-btn" id="image-upload-btn" title="Upload Image">
                                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                            </button>
                            <button class="tool-btn" id="camera-btn" title="Camera Capture">
                                <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                            </button>
                            <button class="tool-btn" id="mic-btn" title="Voice Input">
                                <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                            </button>
                        </div>
                        <div class="composer-tools-right">
                            <button class="send-btn" id="send-btn" title="Send Message">
                                <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">Settings</span>
                <button class="icon-btn" id="settings-close-btn">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <div class="setting-item">
