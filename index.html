<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="WEURA AI — Think Beyond.">
  <title>WEURA AI — Think Beyond.</title>

  <style>
    :root{
      --bg:#0b0d12;
      --bg-soft:#10131a;
      --surface:#151922;
      --surface-2:#1a1f29;
      --surface-hover:#202632;
      --text:#f5f7fb;
      --text-soft:#aeb6c5;
      --text-muted:#747d8d;
      --border:rgba(255,255,255,.08);
      --border-strong:rgba(255,255,255,.13);
      --blue:#3b82f6;
      --blue-strong:#2563eb;
      --blue-soft:rgba(59,130,246,.14);
      --danger:#ef4444;
      --green:#22c55e;
      --sidebar-width:272px;
      --composer-max:820px;
      --content-max:900px;
      --radius:14px;
      --transition:160ms cubic-bezier(.2,.8,.2,1);
    }

    [data-theme="light"]{
      --bg:#fff;
      --bg-soft:#f7f8fa;
      --surface:#f4f5f7;
      --surface-2:#eceef2;
      --surface-hover:#e5e8ed;
      --text:#111318;
      --text-soft:#555e6d;
      --text-muted:#818a98;
      --border:rgba(0,0,0,.08);
      --border-strong:rgba(0,0,0,.13);
      --blue:#2563eb;
      --blue-strong:#1d4ed8;
      --blue-soft:rgba(37,99,235,.1);
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--text);
    }

    body{
      overflow:hidden;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    button,input,textarea,select{font:inherit}
    button{border:0;cursor:pointer}
    svg{
      width:18px;
      height:18px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
      flex:none;
    }

    /* LOADER */

    #weuraLoader{
      position:fixed;
      inset:0;
      z-index:99999;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#0b0d12;
      transition:.5s;
    }

    #weuraLoader.is-hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .loader-logo,
    .brand-logo,
    .welcome-logo,
    .mini-logo{
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      border-radius:50%;
    }

    .loader-logo{
      width:92px;
      height:92px;
      box-shadow:0 18px 60px rgba(0,0,0,.35);
      animation:pulse 1.7s infinite;
    }

    .loader-logo span,
    .brand-logo span,
    .welcome-logo span,
    .mini-logo{
      background:linear-gradient(135deg,#111827,#2563eb);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      font-weight:900;
    }

    .loader-logo span{font-size:46px}

    @keyframes pulse{
      50%{transform:scale(1.035)}
    }

    /* APP */

    #app{
      width:100%;
      height:100dvh;
      display:flex;
    }

    /* SIDEBAR */

    #sidebar{
      width:var(--sidebar-width);
      height:100%;
      flex:0 0 var(--sidebar-width);
      display:flex;
      flex-direction:column;
      background:var(--bg-soft);
      border-right:1px solid var(--border);
      z-index:100;
      transition:transform var(--transition);
    }

    .sidebar-top{padding:15px 13px 12px}

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      padding:7px 8px 16px;
    }

    .brand-logo{
      width:35px;
      height:35px;
      flex:none;
    }

    .brand-logo span{font-size:18px}

    .brand-info{min-width:0}
    .brand-name{font-size:14px;font-weight:700}
    .brand-tagline{
      margin-top:1px;
      color:var(--text-muted);
      font-size:10px;
    }

    .new-chat-btn{
      width:100%;
      min-height:44px;
      display:flex;
      align-items:center;
      gap:11px;
      padding:0 13px;
      border-radius:12px;
      color:var(--text);
      background:transparent;
      border:1px solid var(--border);
    }

    .new-chat-btn:hover{
      background:var(--surface);
      border-color:var(--border-strong);
    }

    .new-chat-btn svg{color:var(--blue)}

    .sidebar-section{padding:5px 13px 0}

    .sidebar-label{
      padding:10px 8px 7px;
      color:var(--text-muted);
      font-size:10px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.8px;
    }

    #historyList{
      display:flex;
      flex-direction:column;
      gap:2px;
      max-height:calc(100dvh - 245px);
      overflow-y:auto;
    }

    .history-item{
      width:100%;
      min-height:40px;
      display:flex;
      align-items:center;
      gap:9px;
      padding:0 9px;
      border-radius:10px;
      color:var(--text-soft);
      background:transparent;
      text-align:start;
    }

    .history-item:hover{
      background:var(--surface);
      color:var(--text);
    }

    .history-item.active{
      background:var(--blue-soft);
      color:var(--text);
    }

    .history-item-title{
      min-width:0;
      flex:1;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      font-size:12px;
    }

    .history-delete{
      opacity:0;
      width:25px;
      height:25px;
      border-radius:7px;
      background:transparent;
      color:var(--text-muted);
    }

    .history-item:hover .history-delete{opacity:1}

    .sidebar-bottom{
      margin-top:auto;
      padding:12px 13px 14px;
      border-top:1px solid var(--border);
    }

    .connection{
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px;
      color:var(--text-muted);
      font-size:11px;
    }

    .connection-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--green);
      box-shadow:0 0 0 4px rgba(34,197,94,.1);
    }

    /* OVERLAY */

    #overlay{
      position:fixed;
      inset:0;
      z-index:90;
      background:rgba(0,0,0,.48);
      opacity:0;
      visibility:hidden;
      transition:.16s;
    }

    #overlay.show{
      opacity:1;
      visibility:visible;
    }

    /* MAIN */

    #main{
      min-width:0;
      flex:1;
      height:100%;
      display:flex;
      flex-direction:column;
      background:var(--bg);
      position:relative;
    }

    /* TOPBAR */

    .topbar{
      height:58px;
      min-height:58px;
      display:flex;
      align-items:center;
      padding:0 15px;
      border-bottom:1px solid var(--border);
      background:var(--bg);
      z-index:20;
    }

    .topbar-left{
      flex:1;
      min-width:0;
      display:flex;
      align-items:center;
      gap:7px;
    }

    .topbar-right{
      display:flex;
      align-items:center;
      gap:7px;
    }

    .topbar-title{
      font-size:13px;
      font-weight:650;
    }

    .icon-btn{
      width:38px;
      height:38px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:11px;
      color:var(--text-soft);
      background:transparent;
    }

    .icon-btn:hover{
      background:var(--surface);
      color:var(--text);
    }

    #menuBtn{display:none}

    /* CHAT */

    #messages{
      flex:1;
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      padding:34px 20px 150px;
      scroll-behavior:auto;
    }

    #welcome{
      width:min(100%,var(--content-max));
      min-height:calc(100% - 35px);
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-align:center;
      padding:40px 12px;
    }

    .welcome-logo{
      width:68px;
      height:68px;
      margin-bottom:20px;
      box-shadow:0 15px 50px rgba(0,0,0,.2);
    }

    .welcome-logo span{font-size:34px}

    .welcome-title{
      margin:0;
      font-size:clamp(27px,5vw,40px);
      line-height:1.1;
      letter-spacing:-1.5px;
    }

    .welcome-subtitle{
      max-width:520px;
      margin:12px auto 0;
      color:var(--text-soft);
      font-size:14px;
      line-height:1.7;
    }

    .quick-actions{
      width:100%;
      max-width:690px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:9px;
      margin-top:28px;
    }

    .quick-action{
      min-height:72px;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:center;
      gap:8px;
      padding:13px;
      text-align:start;
      border-radius:15px;
      color:var(--text-soft);
      background:var(--surface);
      border:1px solid var(--border);
      transition:.16s;
    }

    .quick-action:hover{
      color:var(--text);
      background:var(--surface-hover);
      border-color:var(--border-strong);
      transform:translateY(-1px);
    }

    .quick-action svg{color:var(--blue)}
    .quick-action span{
      font-size:11px;
      font-weight:600;
    }

    /* MESSAGES */

    .message{
      width:min(100%,var(--content-max));
      margin:0 auto 28px;
      display:flex;
      gap:14px;
    }

    .message-avatar{
      width:32px;
      height:32px;
      flex:0 0 32px;
    }

    .mini-logo{
      width:29px;
      height:29px;
      font-size:14px;
    }

    .user-avatar{
      width:29px;
      height:29px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      background:var(--surface-2);
      color:var(--text-soft);
      font-size:10px;
      font-weight:700;
    }

    .message-body{
      min-width:0;
      flex:1;
    }

    .message-label{
      margin-bottom:6px;
      color:var(--text-muted);
      font-size:10px;
      font-weight:700;
    }

    .message-content{
      color:var(--text);
      font-size:14px;
      line-height:1.75;
      overflow-wrap:anywhere;
    }

    .message-content h1,
    .message-content h2,
    .message-content h3{
      line-height:1.25;
    }

    .message-content code{
      padding:2px 5px;
      border-radius:5px;
      background:var(--surface-2);
    }

    .code-block{
      margin:12px 0;
      padding:14px;
      overflow-x:auto;
      border-radius:12px;
      background:#080a0f;
      color:#e5e7eb;
      font-family:monospace;
      font-size:12px;
      line-height:1.6;
    }

    .message-actions{
      display:flex;
      gap:4px;
      margin-top:9px;
    }

    .message-action{
      min-height:30px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:0 8px;
      border-radius:8px;
      color:var(--text-muted);
      background:transparent;
      font-size:10px;
      font-weight:600;
    }

    .message-action:hover{
      color:var(--text);
      background:var(--surface);
    }

    /* TYPING */

    .typing{
      display:inline-flex;
      gap:4px;
    }

    .typing span{
      width:5px;
      height:5px;
      border-radius:50%;
      background:var(--text-muted);
      animation:typing 1.1s infinite;
    }

    .typing span:nth-child(2){animation-delay:.14s}
    .typing span:nth-child(3){animation-delay:.28s}

    @keyframes typing{
      0%,60%,100%{transform:translateY(0);opacity:.35}
      30%{transform:translateY(-3px);opacity:1}
    }

    /* COMPOSER */

    .composer-wrap{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      z-index:30;
      padding:10px 16px calc(13px + env(safe-area-inset-bottom));
      background:linear-gradient(to bottom,transparent,var(--bg) 28%);
      pointer-events:none;
    }

    .composer{
      width:min(100%,var(--composer-max));
      margin:auto;
      pointer-events:auto;
      border:1px solid var(--border-strong);
      background:var(--surface);
      border-radius:20px;
      box-shadow:0 15px 50px rgba(0,0,0,.18);
      overflow:hidden;
    }

    .composer-input-row{
      display:flex;
      align-items:flex-end;
      gap:6px;
      padding:9px 9px 9px 13px;
    }

    #messageInput{
      min-width:0;
      flex:1;
      min-height:40px;
      max-height:180px;
      resize:none;
      padding:10px 2px;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:14px;
      line-height:1.5;
    }

    #messageInput::placeholder{color:var(--text-muted)}

    .composer-tools{
      display:flex;
      align-items:center;
      gap:2px;
    }

    .composer-tool{
      width:36px;
      height:36px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:10px;
      color:var(--text-muted);
      background:transparent;
    }

    .composer-tool:hover{
      color:var(--text);
      background:var(--surface-hover);
    }

    #sendBtn,
    #stopBtn{
      width:38px;
      height:38px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      color:#fff;
    }

    #sendBtn{background:var(--blue)}
    #sendBtn:hover{background:var(--blue-strong)}
    #sendBtn:disabled{opacity:.42}

    #stopBtn{
      display:none;
      background:var(--danger);
    }

    .composer-bottom{
      min-height:31px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:0 12px 9px;
    }

    .composer-select{
      max-width:125px;
      padding:5px 7px;
      border:0;
      outline:0;
      border-radius:7px;
      background:transparent;
      color:var(--text-muted);
      font-size:10px;
      font-weight:600;
    }

    .search-control{
      display:flex;
      align-items:center;
      gap:6px;
      margin-left:auto;
      color:var(--text-muted);
      font-size:10px;
      font-weight:600;
    }

    .search-control input{
      width:30px;
      height:17px;
      appearance:none;
      position:relative;
      border-radius:99px;
      background:var(--surface-hover);
      cursor:pointer;
    }

    .search-control input::after{
      content:"";
      position:absolute;
      top:3px;
      left:3px;
      width:11px;
      height:11px;
      border-radius:50%;
      background:var(--text-muted);
      transition:.16s;
    }

    .search-control input:checked{
      background:var(--blue-soft);
    }

    .search-control input:checked::after{
      transform:translateX(13px);
      background:var(--blue);
    }

    .status{
      margin-left:4px;
      color:var(--text-muted);
      font-size:9px;
      white-space:nowrap;
    }

    .hidden-input{display:none}

    /* CAMERA */

    .camera-modal{
      position:fixed;
      inset:0;
      z-index:10000;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(0,0,0,.72);
      backdrop-filter:blur(12px);
    }

    .camera-card{
      width:min(100%,650px);
      padding:12px;
      border-radius:20px;
      background:var(--surface);
      border:1px solid var(--border-strong);
    }

    .camera-card video{
      display:block;
      width:100%;
      max-height:65vh;
      object-fit:cover;
      border-radius:14px;
      background:#000;
    }

    .camera-actions{
      display:flex;
      gap:8px;
      margin-top:10px;
    }

    .camera-actions button{
      flex:1;
      min-height:42px;
      border-radius:11px;
      color:var(--text);
      background:var(--surface-2);
    }

    .camera-actions button:first-child{
      color:#fff;
      background:var(--blue);
    }

    /* MOBILE */

    @media(max-width:850px){
      #sidebar{
        position:fixed;
        left:0;
        top:0;
        bottom:0;
        transform:translateX(-105%);
        box-shadow:20px 0 60px rgba(0,0,0,.3);
      }

      #sidebar.open{transform:translateX(0)}
      #menuBtn{display:flex}

      .quick-actions{
        grid-template-columns:repeat(2,1fr);
      }

      #messages{
        padding:26px 14px 145px;
      }
    }

    @media(max-width:520px){
      .topbar{
        padding-left:8px;
        padding-right:8px;
      }

      .quick-actions{gap:7px}

      .quick-action{
        min-height:66px;
      }

      .quick-action span{font-size:10px}

      .composer-wrap{
        padding:7px 8px calc(8px + env(safe-area-inset-bottom));
      }

      .composer{border-radius:18px}

      .search-control,
      .status{
        display:none;
      }

      .message-content{font-size:13px}

      .message-action span{display:none}

      .message-action{
        width:31px;
        padding:0;
      }
    }
  </style>
</head>

<body>

  <!-- LOADER -->
  <div id="weuraLoader">
    <div class="loader-logo">
      <span>W</span>
    </div>
  </div>

  <!-- APP -->
  <div id="app">

    <!-- SIDEBAR -->
    <aside id="sidebar">

      <div class="sidebar-top">

        <div class="brand">
          <div class="brand-logo">
            <span>W</span>
          </div>

          <div class="brand-info">
            <div class="brand-name">WEURA AI</div>
            <div class="brand-tagline">Think Beyond.</div>
          </div>
        </div>

        <button
          id="newChatBtn"
          class="new-chat-btn"
          type="button"
        >
          <svg viewBox="0 0 24 24">
            <path d="M12 5v14"/>
            <path d="M5 12h14"/>
          </svg>
          <span>New chat</span>
        </button>

      </div>

      <div class="sidebar-section">

        <div class="sidebar-label">
          History
        </div>

        <div id="historyList"></div>

      </div>

      <div class="sidebar-bottom">

        <div class="connection">

          <span class="connection-dot"></span>

          <!-- IMPORTANT:
               unique ID — no duplicate statusText -->
          <span id="statusTextSidebar">
            Ready
          </span>

        </div>

      </div>

    </aside>

    <div id="overlay"></div>

    <!-- MAIN -->
    <main id="main">

      <!-- TOPBAR -->
      <header class="topbar">

        <div class="topbar-left">

          <button
            id="menuBtn"
            class="icon-btn"
            type="button"
            aria-label="Open menu"
          >
            <svg viewBox="0 0 24 24">
              <path d="M4 6h16"/>
              <path d="M4 12h16"/>
              <path d="M4 18h16"/>
            </svg>
          </button>

          <div class="topbar-title">
            WEURA AI
          </div>

        </div>

        <div class="topbar-right">

          <button
            id="themeBtn"
            class="icon-btn"
            type="button"
            aria-label="Theme"
          >
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2"/>
              <path d="M12 20v2"/>
              <path d="M4.93 4.93l1.42 1.42"/>
              <path d="M17.65 17.65l1.42 1.42"/>
              <path d="M2 12h2"/>
              <path d="M20 12h2"/>
              <path d="M4.93 19.07l1.42-1.42"/>
              <path d="M17.65 6.35l1.42-1.42"/>
            </svg>
          </button>

          <button
            id="settingsBtn"
            class="icon-btn"
            type="button"
            aria-label="Settings"
          >
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.9 1.9-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2.7v-.09a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.9-1.9.06-.06A1.7 1.7 0 0 0 5.75 15a1.7 1.7 0 0 0-1.56-1.03H4v-2.7h.19a1.7 1.7 0 0 0 1.56-1.03 1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.9-1.9.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 10.22 5V4h2.7v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.9 1.9-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 19.03 10H20v2.7h-.09A1.7 1.7 0 0 0 19.4 15Z"/>
            </svg>
          </button>

        </div>

      </header>

      <!-- MESSAGES -->
      <section
        id="messages"
        aria-live="polite"
      >

        <div id="welcome">

          <div class="welcome-logo">
            <span>W</span>
          </div>

          <h1 class="welcome-title">
            How can I help?
          </h1>

          <p class="welcome-subtitle">
            Ask WEURA anything. Think,
            create, research, code and
            explore with an intelligent
            assistant built around you.
          </p>

          <div class="quick-actions">

            <button
              class="quick-action"
              type="button"
              data-prompt="Explain this concept to me clearly and simply."

              <span>Explain</span>

            <button

                  <path d="m20.5 11.5-8.8 8.8a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-8.8 8.8a2 2 0 0 1-2.8-2.8l8.2-8.2"/>

                  <path d="M5 11a7 7 0 0 0 14 0"/>
                  <path d="M12 18v3"/>
                  <path d="M8 21h8"/>

              </button>

              <button
                id="sendBtn"
                type="button"

                <svg viewBox="0 0 24 24">

              <button

                aria-label="Stop generation"
              >

                  <rect x="7" y="7" width="10" height="10" rx="2"/>

            </div>

          </div>

          <div class="composer-bottom">

            <select

            <!-- UNIQUE statusText -->
            <span

              class="status"
            >
              Ready

          </div>

        </div>

      </div>

    </main>

  </div>

  <!-- FILE INPUTS -->

  <input
    id="fileInput"
    class="hidden-input"
    type="file"
    accept=".txt,.pdf,.doc,.docx,.md,.csv,.json,.js,.html,.css,.py"
  >

  <input
    id="imageInput"
    class="hidden-input"
    type="file"
    accept="image/*"
  >

  <input
    id="cameraInput"
    class="hidden-input"
    type="file"
    accept="image/*"
    capture="environment"
  >

  <!-- LOADER FAILSAFE -->

  <script>
    (function(){

      const loader =
        document.getElementById("weuraLoader");

      if(!loader) return;

      function hide(){
        loader.classList.add("is-hidden");

        setTimeout(function(){
          if(loader.parentNode){
            loader.remove();
          }
        },650);
      }

      if(document.readyState === "loading"){
        document.addEventListener(
          "DOMContentLoaded",
          function(){
            setTimeout(hide,450);
          },
          {once:true}
        );
      }else{
        setTimeout(hide,450);
      }

      window.addEventListener(
        "load",
        function(){
          setTimeout(hide,250);
        },
        {once:true}
      );

      setTimeout(hide,3500);

    })();
  </script>

  <!--
    WEURA ENGINE
    Cache-busting version intentionally changed.
    This forces the browser to request the latest chat.js.
  -->

  <script
    src="./chat.js?v=20260912-2301"
    defer
  ></script>
