<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b0d12"
  >

  <meta
    name="description"
    content="WEURA AI — Think Beyond."
  >

  <title>WEURA AI — Think Beyond.</title>

  <style>
    /* =====================================================
       WEURA AI
       Premium UI
    ===================================================== */

    :root {
      --bg: #0b0d12;
      --bg-soft: #10131a;
      --surface: #151922;
      --surface-2: #1a1f29;
      --surface-hover: #202632;

      --text: #f5f7fb;
      --text-soft: #aeb6c5;
      --text-muted: #747d8d;

      --border: rgba(255,255,255,.08);
      --border-strong: rgba(255,255,255,.13);

      --blue: #3b82f6;
      --blue-strong: #2563eb;
      --blue-soft: rgba(59,130,246,.14);

      --danger: #ef4444;

      --sidebar-width: 272px;
      --composer-max: 820px;
      --content-max: 900px;

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 26px;

      --shadow:
        0 20px 70px rgba(0,0,0,.30);

      --transition:
        160ms cubic-bezier(.2,.8,.2,1);
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --bg-soft: #f7f8fa;
      --surface: #f4f5f7;
      --surface-2: #eceef2;
      --surface-hover: #e5e8ed;

      --text: #111318;
      --text-soft: #555e6d;
      --text-muted: #818a98;

      --border: rgba(0,0,0,.08);
      --border-strong: rgba(0,0,0,.13);

      --blue: #2563eb;
      --blue-strong: #1d4ed8;
      --blue-soft: rgba(37,99,235,.10);

      --shadow:
        0 20px 60px rgba(0,0,0,.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--bg);
      color-scheme: dark;
    }

    html[data-theme="light"] {
      color-scheme: light;
    }

    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =====================================================
       ICON SYSTEM
    ===================================================== */

    svg {
      width: 18px;
      height: 18px;

      fill: none;
      stroke: currentColor;

      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;

      flex: 0 0 auto;
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
    }

    /* =====================================================
       LOADING SCREEN
    ===================================================== */

    #weuraLoader {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #0b0d12;

      opacity: 1;
      visibility: visible;

      transition:
        opacity .55s ease,
        visibility .55s ease;
    }

    #weuraLoader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-logo {
      width: 92px;
      height: 92px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #fff;

      box-shadow:
        0 0 0 1px rgba(255,255,255,.12),
        0 18px 60px rgba(0,0,0,.35);

      animation:
        loaderPulse 1.7s
        cubic-bezier(.4,0,.2,1)
        infinite;
    }

    .loader-logo span {
      font-size: 46px;
      line-height: 1;

      font-weight: 900;
      letter-spacing: -5px;

      transform: translateX(-2px);

      background:
        linear-gradient(
          135deg,
          #111827,
          #2563eb
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    @keyframes loaderPulse {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.035);
      }
    }

    /* =====================================================
       APP
    ===================================================== */

    #app {
      display: flex;

      width: 100%;
      height: 100dvh;

      opacity: 1;
    }

    /* =====================================================
       SIDEBAR
    ===================================================== */

    #sidebar {
      position: relative;

      width: var(--sidebar-width);
      height: 100%;

      flex: 0 0 var(--sidebar-width);

      display: flex;
      flex-direction: column;

      background:
        color-mix(
          in srgb,
          var(--bg-soft) 94%,
          var(--blue) 6%
        );

      border-right: 1px solid var(--border);

      z-index: 100;

      transition:
        transform var(--transition);
    }

    .sidebar-top {
      padding: 15px 13px 12px;
    }

    .brand {
      display: flex;
      align-items: center;

      gap: 10px;

      padding: 7px 8px 16px;
    }

    .brand-logo {
      width: 35px;
      height: 35px;

      flex: 0 0 35px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #fff;

      box-shadow:
        0 5px 20px rgba(0,0,0,.18);
    }

    .brand-logo span {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -2px;

      transform: translateX(-1px);

      background:
        linear-gradient(
          135deg,
          #111827,
          #2563eb
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand-info {
      min-width: 0;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -.2px;
    }

    .brand-tagline {
      margin-top: 1px;

      font-size: 10px;
      color: var(--text-muted);

      letter-spacing: .3px;
    }

    .new-chat-btn {
      width: 100%;

      min-height: 44px;

      display: flex;
      align-items: center;
      gap: 11px;

      padding: 0 13px;

      border-radius: 12px;

      color: var(--text);
      background: transparent;

      border: 1px solid var(--border);

      transition:
        background var(--transition),
        border-color var(--transition),
        transform var(--transition);
    }

    .new-chat-btn:hover {
      background: var(--surface);
      border-color: var(--border-strong);
    }

    .new-chat-btn:active {
      transform: scale(.985);
    }

    .new-chat-btn svg {
      color: var(--blue);
    }

    .sidebar-section {
      padding: 5px 13px 0;
    }

    .sidebar-label {
      padding: 10px 8px 7px;

      font-size: 10px;
      font-weight: 700;

      color: var(--text-muted);

      text-transform: uppercase;
      letter-spacing: .8px;
    }

    #historyList {
      display: flex;
      flex-direction: column;

      gap: 2px;

      max-height: calc(100dvh - 245px);

      overflow-y: auto;

      scrollbar-width: thin;
    }

    .history-item {
      position: relative;

      width: 100%;
      min-height: 40px;

      display: flex;
      align-items: center;

      gap: 9px;

      padding: 0 9px;

      border-radius: 10px;

      color: var(--text-soft);
      background: transparent;

      text-align: start;

      transition:
        background var(--transition),
        color var(--transition);
    }

    .history-item:hover {
      background: var(--surface);
      color: var(--text);
    }

    .history-item.active {
      background: var(--blue-soft);
      color: var(--text);
    }

    .history-item-icon {
      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--text-muted);
    }

    .history-item-icon svg {
      width: 15px;
      height: 15px;
    }

    .history-item-title {
      min-width: 0;

      flex: 1;

      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 12px;
    }

    .history-delete {
      opacity: 0;

      width: 25px;
      height: 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 7px;

      color: var(--text-muted);

      font-size: 17px;
      line-height: 1;

      transition:
        opacity var(--transition),
        background var(--transition),
        color var(--transition);
    }

    .history-item:hover .history-delete {
      opacity: 1;
    }

    .history-delete:hover {
      color: var(--danger);
      background: rgba(239,68,68,.10);
    }

    .sidebar-bottom {
      margin-top: auto;

      padding: 12px 13px 14px;

      border-top: 1px solid var(--border);
    }

    .connection {
      display: flex;
      align-items: center;

      gap: 8px;

      padding: 8px;

      color: var(--text-muted);

      font-size: 11px;
    }

    .connection-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #22c55e;

      box-shadow:
        0 0 0 4px
        rgba(34,197,94,.10);
    }

    /* =====================================================
       OVERLAY
    ===================================================== */

    #overlay {
      position: fixed;
      inset: 0;

      z-index: 90;

      background:
        rgba(0,0,0,.48);

      opacity: 0;
      visibility: hidden;

      transition:
        opacity var(--transition),
        visibility var(--transition);
    }

    #overlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* =====================================================
       MAIN
    ===================================================== */

    #main {
      position: relative;

      min-width: 0;
      flex: 1;

      height: 100%;

      display: flex;
      flex-direction: column;

      background: var(--bg);
    }

    /* =====================================================
       TOP BAR
    ===================================================== */

    .topbar {
      position: relative;

      height: 58px;
      min-height: 58px;

      display: flex;
      align-items: center;

      padding:
        0 max(15px, env(safe-area-inset-right))
        0 max(15px, env(safe-area-inset-left));

      border-bottom: 1px solid var(--border);

      background:
        color-mix(
          in srgb,
          var(--bg) 88%,
          transparent
        );

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      z-index: 20;
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .topbar-left {
      flex: 1;
      min-width: 0;
    }

    .topbar-title {
      font-size: 13px;
      font-weight: 650;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      color: var(--text-soft);
      background: transparent;

      transition:
        background var(--transition),
        color var(--transition),
        transform var(--transition);
    }

    .icon-btn:hover {
      color: var(--text);
      background: var(--surface);
    }

    .icon-btn:active {
      transform: scale(.94);
    }

    #menuBtn {
      display: none;
    }

    /* =====================================================
       CHAT AREA
    ===================================================== */

    #messages {
      position: relative;

      flex: 1;

      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      scroll-behavior: auto;

      padding:
        34px 20px
        150px;

      scrollbar-width: thin;
      scrollbar-color:
        var(--surface-hover)
        transparent;
    }

    #messages::-webkit-scrollbar {
      width: 8px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: var(--surface-hover);
      border-radius: 99px;
    }

    /* =====================================================
       WELCOME
    ===================================================== */

    #welcome {
      width: min(
        100%,
        var(--content-max)
      );

      min-height:
        calc(100% - 35px);

      margin: auto;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      text-align: center;

      padding: 40px 12px;
    }

    .welcome-logo {
      width: 68px;
      height: 68px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #fff;

      box-shadow:
        0 15px 50px rgba(0,0,0,.20);

      margin-bottom: 20px;
    }

    .welcome-logo span {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -4px;

      transform: translateX(-2px);

      background:
        linear-gradient(
          135deg,
          #111827,
          #2563eb
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome-title {
      margin: 0;

      font-size:
        clamp(27px, 5vw, 40px);

      line-height: 1.1;

      letter-spacing: -1.5px;

      font-weight: 750;
    }

    .welcome-subtitle {
      max-width: 520px;

      margin:
        12px auto 0;

      color: var(--text-soft);

      font-size: 14px;
      line-height: 1.7;
    }

    .quick-actions {
      width: 100%;
      max-width: 690px;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 9px;

      margin-top: 28px;
    }

    .quick-action {
      min-height: 72px;

      display: flex;
      flex-direction: column;

      align-items: flex-start;
      justify-content: center;

      gap: 8px;

      padding: 13px;

      text-align: start;

      border-radius: 15px;

      color: var(--text-soft);
      background: var(--surface);

      border: 1px solid var(--border);

      transition:
        background var(--transition),
        border-color var(--transition),
        transform var(--transition),
        color var(--transition);
    }

    .quick-action:hover {
      color: var(--text);
      background: var(--surface-hover);

      border-color:
        var(--border-strong);

      transform: translateY(-1px);
    }

    .quick-action svg {
      color: var(--blue);
    }

    .quick-action span {
      font-size: 11px;
      font-weight: 600;
    }

    /* =====================================================
       MESSAGE
    ===================================================== */

    .message {
      width: min(
        100%,
        var(--content-max)
      );

      margin:
        0 auto 28px;

      display: flex;

      gap: 14px;

      animation:
        messageIn .22s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-avatar {
      width: 32px;
      height: 32px;

      flex: 0 0 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-top: 1px;
    }

    .mini-logo {
      width: 29px;
      height: 29px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #fff;

      color: #111827;

      font-size: 14px;
      font-weight: 900;

      letter-spacing: -2px;

      box-shadow:
        0 4px 15px rgba(0,0,0,.16);
    }

    .user-avatar {
      width: 29px;
      height: 29px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: var(--surface-2);

      color: var(--text-soft);

      font-size: 10px;
      font-weight: 700;
    }

    .message-body {
      min-width: 0;
      flex: 1;
    }

    .message-label {
      margin-bottom: 6px;

      color: var(--text-muted);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: .4px;
    }

    .message-content {
      max-width: 100%;

      color: var(--text);

      font-size: 14px;

      line-height: 1.75;

      overflow-wrap: anywhere;
    }

    .message-content h1,
    .message-content h2,
    .message-content h3 {
      margin:
        16px 0 8px;

      line-height: 1.25;
    }

    .message-content h1 {
      font-size: 22px;
    }

    .message-content h2 {
      font-size: 19px;
    }

    .message-content h3 {
      font-size: 16px;
    }

    .message-content strong {
      font-weight: 700;
    }

    .message-content code {
      padding:
        2px 5px;

      border-radius: 5px;

      background: var(--surface-2);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size: .9em;
    }

    .code-block {
      margin:
        12px 0;

      padding: 14px;

      overflow-x: auto;

      border-radius: 12px;

      background:
        #080a0f;

      border:
        1px solid
        rgba(255,255,255,.08);

      color: #e5e7eb;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size: 12px;

      line-height: 1.6;
    }

    [data-theme="light"]
    .code-block {
      background: #111318;
      color: #f5f7fb;
    }

    /* =====================================================
       MESSAGE ACTIONS
    ===================================================== */

    .message-actions {
      display: flex;

      align-items: center;

      gap: 4px;

      margin-top: 9px;
    }

    .message-action {
      min-height: 30px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 6px;

      padding: 0 8px;

      border-radius: 8px;

      color: var(--text-muted);

      background: transparent;

      font-size: 10px;
      font-weight: 600;

      transition:
        color var(--transition),
        background var(--transition);
    }

    .message-action:hover {
      color: var(--text);
      background: var(--surface);
    }

    .message-action svg {
      width: 14px;
      height: 14px;
    }

    /* =====================================================
       TYPING
    ===================================================== */

    .typing {
      display: inline-flex;

      align-items: center;

      gap: 4px;

      height: 20px;
    }

    .typing span {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: var(--text-muted);

      animation:
        typingDot 1.1s
        infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: .14s;
    }

    .typing span:nth-child(3) {
      animation-delay: .28s;
    }

    @keyframes typingDot {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: .35;
      }

      30% {
        transform: translateY(-3px);
        opacity: 1;
      }
    }

    /* =====================================================
       COMPOSER
    ===================================================== */

    .composer-wrap {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 30;

      padding:
        10px 16px
        calc(13px + env(safe-area-inset-bottom));

      background:
        linear-gradient(
          to bottom,
          transparent,
          var(--bg) 28%
        );

      pointer-events: none;
    }

    .composer {
      width: min(
        100%,
        var(--composer-max)
      );

      margin: 0 auto;

      pointer-events: auto;

      border:
        1px solid
        var(--border-strong);

      background:
        color-mix(
          in srgb,
          var(--surface) 96%,
          var(--blue) 4%
        );

      border-radius: 20px;

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.18);

      overflow: hidden;
    }

    .composer-input-row {
      display: flex;

      align-items: flex-end;

      gap: 6px;

      padding:
        9px 9px 9px 13px;
    }

    #messageInput {
      min-width: 0;
      flex: 1;

      min-height: 40px;
      max-height: 180px;

      resize: none;

      padding:
        10px 2px;

      border: 0;
      outline: 0;

      background: transparent;

      color: var(--text);

      font-size: 14px;
      line-height: 1.5;

      scrollbar-width: thin;
    }

    #messageInput::placeholder {
      color: var(--text-muted);
    }

    .composer-tools {
      display: flex;

      align-items: center;

      gap: 2px;
    }

    .composer-tool {
      width: 36px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      color: var(--text-muted);

      background: transparent;

      transition:
        background var(--transition),
        color var(--transition),
        transform var(--transition);
    }

    .composer-tool:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .composer-tool:active {
      transform: scale(.94);
    }

    #sendBtn {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      color: #fff;

      background: var(--blue);

      transition:
        background var(--transition),
        transform var(--transition),
        opacity var(--transition);
    }

    #sendBtn:hover {
      background:
        var(--blue-strong);
    }

    #sendBtn:active {
      transform: scale(.94);
    }

    #sendBtn:disabled {
      opacity: .42;
      cursor: default;
    }

    #sendBtn svg {
      width: 17px;
      height: 17px;
    }

    #stopBtn {
      width: 38px;
      height: 38px;

      display: none;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      color: #fff;

      background:
        var(--danger);

      transition:
        transform var(--transition);
    }

    #stopBtn:active {
      transform: scale(.94);
    }

    .composer-bottom {
      min-height: 31px;

      display: flex;
      align-items: center;

      gap: 8px;

      padding:
        0 12px 9px;
    }

    .composer-select {
      max-width: 125px;

      padding:
        5px 7px;

      border: 0;
      outline: 0;

      border-radius: 7px;

      background: transparent;

      color: var(--text-muted);

      font-size: 10px;
      font-weight: 600;
    }

    .composer-select:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .search-control {
      display: flex;
      align-items: center;

      gap: 6px;

      margin-left: auto;

      color: var(--text-muted);

      font-size: 10px;
      font-weight: 600;
    }

    .search-control input {
      width: 30px;
      height: 17px;

      appearance: none;

      position: relative;

      border-radius: 99px;

      background:
        var(--surface-hover);

      cursor: pointer;

      transition:
        background var(--transition);
    }

    .search-control input::after {
      content: "";

      position: absolute;

      top: 3px;
      left: 3px;

      width: 11px;
      height: 11px;

      border-radius: 50%;

      background:
        var(--text-muted);

      transition:
        transform var(--transition),
        background var(--transition);
    }

    .search-control input:checked {
      background: var(--blue-soft);
    }

    .search-control input:checked::after {
      transform:
        translateX(13px);

      background:
        var(--blue);
    }

    .status {
      margin-left: 4px;

      color: var(--text-muted);

      font-size: 9px;

      white-space: nowrap;
    }

    /* =====================================================
       HIDDEN INPUTS
    ===================================================== */

    .hidden-input {
      display: none;
    }

    /* =====================================================
       CAMERA
    ===================================================== */

    .camera-modal {
      position: fixed;
      inset: 0;

      z-index: 10000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0,0,0,.72);

      backdrop-filter: blur(12px);
    }

    .camera-card {
      width: min(
        100%,
        650px
      );

      padding: 12px;

      border-radius: 20px;

      background: var(--surface);

      border:
        1px solid
        var(--border-strong);

      box-shadow: var(--shadow);
    }

    .camera-card video {
      display: block;

      width: 100%;

      max-height: 65vh;

      object-fit: cover;

      border-radius: 14px;

      background: #000;
    }

    .camera-actions {
      display: flex;

      gap: 8px;

      margin-top: 10px;
    }

    .camera-actions button {
      flex: 1;

      min-height: 42px;

      border-radius: 11px;

      color: var(--text);

      background:
        var(--surface-2);
    }

    .camera-actions button:first-child {
      color: #fff;
      background: var(--blue);
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 850px) {
      :root {
        --sidebar-width: 280px;
      }

      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;

        transform:
          translateX(-105%);

        box-shadow:
          20px 0 60px
          rgba(0,0,0,.30);
      }

      #sidebar.open {
        transform:
          translateX(0);
      }

      #menuBtn {
        display: flex;
      }

      .quick-actions {
        grid-template-columns:
          repeat(2, 1fr);
      }

      #messages {
        padding:
          26px 14px
          145px;
      }

      .message {
        gap: 10px;
      }

      .message-avatar {
        width: 29px;
        flex-basis: 29px;
      }
    }

    @media (max-width: 520px) {
      .topbar {
        padding-left: 8px;
        padding-right: 8px;
      }

      .topbar-right {
        gap: 1px;
      }

      .topbar-title {
        font-size: 12px;
      }

      #messages {
        padding:
          20px 12px
          145px;
      }

      .welcome-logo {
        width: 58px;
        height: 58px;
      }

      .welcome-logo span {
        font-size: 29px;
      }

      .welcome-title {
        font-size: 28px;
      }

      .welcome-subtitle {
        font-size: 12px;
      }

      .quick-actions {
        gap: 7px;
      }

      .quick-action {
        min-height: 66px;
      }

      .quick-action span {
        font-size: 10px;
      }

      .composer-wrap {
        padding:
          7px 8px
          calc(
            8px +
            env(safe-area-inset-bottom)
          );
      }

      .composer {
        border-radius: 18px;
      }

      .composer-bottom {
        padding-bottom: 7px;
      }

      .search-control {
        display: none;
      }

      .status {
        display: none;
      }

      .message-content {
        font-size: 13px;
      }

      .message-action span {
        display: none;
      }

      .message-action {
        width: 31px;
        padding: 0;
      }
    }

    /* =====================================================
       REDUCED MOTION
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <!-- ===================================================
       LOADING
  =================================================== -->

  <div id="weuraLoader">
    <div class="loader-logo">
      <span>W</span>
    </div>
  </div>

  <!-- ===================================================
       APP
  =================================================== -->

  <div id="app">

    <!-- =================================================
         SIDEBAR
    ================================================= -->

    <aside id="sidebar">

      <div class="sidebar-top">

        <div class="brand">

          <div class="brand-logo">
            <span>W</span>
          </div>

          <div class="brand-info">
            <div class="brand-name">
              WEURA AI
            </div>

            <div class="brand-tagline">
              Think Beyond.
            </div>
          </div>

        </div>

        <button
          id="newChatBtn"
          class="new-chat-btn"
          type="button"
        >

          <svg viewBox="0 0 24 24">
            <path d="M12 5v14"/>
            <path d="M5 12h14"/>
          </svg>

          <span>New chat</span>

        </button>

      </div>

      <div class="sidebar-section">

        <div class="sidebar-label">
          History
        </div>

        <div id="historyList"></div>

      </div>

      <div class="sidebar-bottom">

        <div class="connection">

          <span class="connection-dot"></span>

          <span id="statusText">
            Ready
          </span>

        </div>

      </div>

    </aside>

    <div id="overlay"></div>

    <!-- =================================================
         MAIN
    ================================================= -->

    <main id="main">

      <!-- TOP BAR -->

      <header class="topbar">

        <div class="topbar-left">

          <button
            id="menuBtn"
            class="icon-btn"
            type="button"
            aria-label="Open menu"
            title="Menu"
          >
            <svg viewBox="0 0 24 24">
              <path d="M4 6h16"/>
              <path d="M4 12h16"/>
              <path d="M4 18h16"/>
            </svg>
          </button>

          <div class="topbar-title">
            WEURA AI
          </div>

        </div>

        <div class="topbar-right">

          <button
            id="themeBtn"
            class="icon-btn"
            type="button"
            aria-label="Theme"
            title="Theme"
          >
            <svg viewBox="0 0 24 24">
              <circle
                cx="12"
                cy="12"
                r="4"
              />
              <path d="M12 2v2"/>
              <path d="M12 20v2"/>
              <path d="m4.93 4.93 1.42 1.42"/>
              <path d="m17.65 17.65 1.42 1.42"/>
              <path d="M2 12h2"/>
              <path d="M20 12h2"/>
              <path d="m4.93 19.07 1.42-1.42"/>
              <path d="m17.65 6.35 1.42-1.42"/>
            </svg>
          </button>

          <button
            id="settingsBtn"
            class="icon-btn"
            type="button"
            aria-label="Settings"
            title="Settings"
          >
            <svg viewBox="0 0 24 24">
              <circle
                cx="12"
                cy="12"
                r="3"
              />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.9 1.9-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2.7v-.09a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.9-1.9.06-.06A1.7 1.7 0 0 0 5.75 15a1.7 1.7 0 0 0-1.56-1.03H4v-2.7h.19a1.7 1.7 0 0 0 1.56-1.03 1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.9-1.9.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 10.22 5V4h2.7v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.9 1.9-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 19.03 10H20v2.7h-.09A1.7 1.7 0 0 0 19.4 15Z"
              />
            </svg>
          </button>

        </div>

      </header>

      <!-- =================================================
           CHAT
      ================================================= -->

      <section
        id="messages"
        aria-live="polite"
      >

        <!-- WELCOME -->

        <div id="welcome">

          <div class="welcome-logo">
            <span>W</span>
          </div>

          <h1 class="welcome-title">
            How can I help?
          </h1>

          <p class="welcome-subtitle">
            Ask WEURA anything. Think,
            create, research, code and
            explore with an intelligent
            assistant built around you.
          </p>

          <div class="quick-actions">

            <button
              class="quick-action"
              type="button"
              data-prompt="Explain this concept to me clearly and simply."
            >
              <svg viewBox="0 0 24 24">
                <circle
                  cx="12"
                  cy="12"
                  r="9"
                />
                <path d="M12 8v4"/>
                <path d="M12 16h.01"/>
              </svg>

              <span>
                Explain
              </span>
            </button>

            <button
              class="quick-action"
              type="button"
              data-prompt="Help me build a complete solution step by step."
            >
              <svg viewBox="0 0 24 24">
                <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.2 2.2-2.8-2.8 2-2.4Z"/>
              </svg>

              <span>
                Build
              </span>
            </button>

            <button
              class="quick-action"
              type="button"
              data-prompt="Research this topic carefully and give me a well-organized answer with sources."
            >
              <svg viewBox="0 0 24 24">
                <circle
                  cx="10.8"
                  cy="10.8"
                  r="6.8"
                />
                <path d="m16 16 5 5"/>
              </svg>

              <span>
                Research
              </span>
            </button>

            <button
              class="quick-action"
              type="button"
              data-prompt="Help me write and debug this code."
            >
              <svg viewBox="0 0 24 24">
                <path d="m8 9-4 3 4 3"/>
                <path d="m16 9 4 3-4 3"/>
                <path d="m14 5-4 14"/>
              </svg>

              <span>
                Code
              </span>
            </button>

          </div>

        </div>

      </section>

      <!-- =================================================
           COMPOSER
      ================================================= -->

      <div class="composer-wrap">

        <div class="composer">

          <div class="composer-input-row">

            <div class="composer-tools">

              <button
                id="fileBtn"
                class="composer-tool"
                type="button"
                aria-label="Attach file"
                title="Attach file"
              >
                <svg viewBox="0 0 24 24">
                  <path d="m20.5 11.5-8.8 8.8a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-8.8 8.8a2 2 0 0 1-2.8-2.8l8.2-8.2"/>
                </svg>
              </button>

              <button
                id="imageBtn"
                class="composer-tool"
                type="button"
                aria-label="Add image"
                title="Image"
              >
                <svg viewBox="0 0 24 24">
                  <rect
                    x="3"
                    y="4"
                    width="18"
                    height="16"
                    rx="3"
                  />
                  <circle
                    cx="8.5"
                    cy="9"
                    r="1.5"
                  />
                  <path
                    d="m4 17 5-5 3.5 3.5 2.5-2.5L20 18"
                  />
                </svg>
              </button>

              <button
                id="cameraBtn"
                class="composer-tool"
                type="button"
                aria-label="Camera"
                title="Camera"
              >
                <svg viewBox="0 0 24 24">
                  <path d="M4 7h4l1.5-2h5L16 7h4a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/>
                  <circle
                    cx="12"
                    cy="13"
                    r="4"
                  />
                </svg>
              </button>

            </div>

            <textarea
              id="messageInput"
              rows="1"
              autocomplete="off"
              spellcheck="true"
              placeholder="Message WEURA..."
              aria-label="Message WEURA"
            ></textarea>

            <div class="composer-tools">

              <button
                id="voiceBtn"
                class="composer-tool"
                type="button"
                aria-label="Voice input"
                title="Voice"
              >
                <svg viewBox="0 0 24 24">
                  <rect
                    x="9"
                    y="3"
                    width="6"
                    height="11"
                    rx="3"
                  />
                  <path d="M5 11a7 7 0 0 0 14 0"/>
                  <path d="M12 18v3"/>
                  <path d="M8 21h8"/>
                </svg>
              </button>

              <button
                id="sendBtn"
                type="button"
                aria-label="Send message"
                title="Send"
              >
                <svg viewBox="0 0 24 24">
                  <path d="M21 3 10 14"/>
                  <path d="m21 3-7 18-4-7-7-4Z"/>
                </svg>
              </button>

              <button
                id="stopBtn"
                type="button"
                aria-label="Stop generation"
                title="Stop"
              >
                <svg viewBox="0 0 24 24">
                  <rect
                    x="7"
                    y="7"
                    width="10"
                    height="10"
                    rx="2"
                  />
                </svg>
              </button>

            </div>

          </div>

          <div class="composer-bottom">

            <select
              id="modeSelect"
              class="composer-select"
              aria-label="WEURA mode"
            >
              <option value="smart">
                Smart
              </option>

              <option value="research">
                Research
              </option>

              <option value="code">
                Code
              </option>

              <option value="creative">
                Creative
              </option>

              <option value="vision">
                Vision
              </option>

              <option value="fast">
                Fast
              </option>
            </select>

            <label class="search-control">
              <span>
                Web Search
              </span>

              <input
                id="searchToggle"
                type="checkbox"
                checked
              >
            </label>

            <span
              id="statusText"
              class="status"
            >
              Ready
            </span>

          </div>

        </div>

      </div>

    </main>

  </div>

  <!-- ===================================================
       FILE INPUTS
  =================================================== -->

  <input
    id="fileInput"
    class="hidden-input"
    type="file"
    accept=".txt,.pdf,.doc,.docx,.md,.csv,.json,.js,.html,.css,.py"
  >

  <input
    id="imageInput"
    class="hidden-input"
    type="file"
    accept="image/*"
  >

  <input
    id="cameraInput"
    class="hidden-input"
    type="file"
    accept="image/*"
    capture="environment"
  >

  <!-- ===================================================
       LOADER FAIL-SAFE
  =================================================== -->

  <script>
    /*
      WEURA loader:
      It NEVER depends on chat.js.
      Even if another script fails,
      the loading screen disappears.
    */

    (function () {
      const loader =
        document.getElementById(
          "weuraLoader"
        );

      if (!loader) return;

      let hidden = false;

      function hideLoader() {
        if (hidden) return;

        hidden = true;

        loader.classList.add(
          "is-hidden"
        );

        setTimeout(() => {
          loader.remove();
        }, 650);
      }

      if (
        document.readyState ===
        "loading"
      ) {
        document.addEventListener(
          "DOMContentLoaded",
          () => {
            setTimeout(
              hideLoader,
              450
            );
          },
          {
            once: true
          }
        );
      } else {
        setTimeout(
          hideLoader,
          450
        );
      }

      window.addEventListener(
        "load",
        () => {
          setTimeout(
            hideLoader,
            250
          );
        },
        {
          once: true
        }
      );

      /*
        Absolute fallback.
      */

      setTimeout(
        hideLoader,
        3500
      );
    })();
  </script>

  <!-- ===================================================
       CHAT ENGINE
  =================================================== -->

<script
  src="chat.js?v=999"
  defer
></script>

</body>
</html>
