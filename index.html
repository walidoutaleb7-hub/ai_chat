<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05030d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>WEURA AI — Think Beyond.</title>

  <style>
    :root{
      --bg:#05030d;
      --bg2:#080713;
      --panel:#0b0a16;
      --panel2:#11101e;
      --line:rgba(255,255,255,.08);
      --line2:rgba(255,255,255,.13);
      --text:#f7f8ff;
      --muted:#9698aa;
      --blue:#4d8dff;
      --blue2:#76aaff;
      --danger:#ff5c72;
      --shadow:0 20px 60px rgba(0,0,0,.45);
      --radius:18px;
      --sidebar:275px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    button{
      border:0;
      outline:0;
      cursor:pointer;
      color:inherit;
    }

    /* =========================
       INTRO
    ========================= */

    #weuraIntro{
      position:fixed;
      inset:0;
      z-index:999999;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(circle at 50% 45%,rgba(53,115,255,.16),transparent 35%),
        #05030d;
      opacity:1;
      visibility:visible;
      transition:
        opacity .7s ease,
        visibility .7s ease;
      pointer-events:auto;
    }

    #weuraIntro.hide{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .intro-core{
      position:relative;
      width:180px;
      height:180px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .intro-ring{
      position:absolute;
      inset:0;
      border:1px solid rgba(85,145,255,.22);
      border-radius:50%;
      animation:introSpin 5s linear infinite;
    }

    .intro-ring:nth-child(2){
      inset:18px;
      border-color:rgba(85,145,255,.14);
      animation-direction:reverse;
      animation-duration:7s;
    }

    .intro-ring:nth-child(3){
      inset:38px;
      border-color:rgba(85,145,255,.10);
      animation-duration:9s;
    }

    .intro-logo{
      width:82px;
      height:82px;
      border-radius:50%;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:
        0 0 45px rgba(79,137,255,.32),
        0 0 100px rgba(79,137,255,.12);
      animation:introPulse 2s ease-in-out infinite;
    }

    .intro-logo span{
      color:#080913;
      font-size:44px;
      font-weight:900;
      letter-spacing:-5px;
      transform:translateX(-2px);
    }

    @keyframes introSpin{
      to{transform:rotate(360deg)}
    }

    @keyframes introPulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.045)}
    }

    /* =========================
       APP
    ========================= */

    #weuraApp{
      position:fixed;
      inset:0;
      display:flex;
      opacity:0;
      transform:scale(.985);
      transition:
        opacity .65s ease,
        transform .65s ease;
    }

    #weuraApp.ready{
      opacity:1;
      transform:scale(1);
    }

    .app-shell{
      position:relative;
      width:100%;
      height:100%;
      display:flex;
      overflow:hidden;
      background:
        radial-gradient(circle at 65% 20%,rgba(52,94,255,.055),transparent 30%),
        var(--bg);
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar{
      position:relative;
      z-index:100;
      width:var(--sidebar);
      height:100%;
      flex:0 0 var(--sidebar);
      background:rgba(7,6,16,.94);
      border-right:1px solid var(--line);
      display:flex;
      flex-direction:column;
      padding:16px;
      transition:transform .25s ease;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:11px;
      margin-bottom:18px;
    }

    .brand-logo{
      width:42px;
      height:42px;
      flex:none;
      border-radius:50%;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 0 25px rgba(65,126,255,.18);
    }

    .brand-logo span{
      color:#080913;
      font-weight:900;
      font-size:23px;
      letter-spacing:-3px;
    }

    .brand-name{
      font-size:16px;
      font-weight:800;
      letter-spacing:.2px;
    }

    .brand-tag{
      color:var(--muted);
      font-size:10px;
      margin-top:2px;
      letter-spacing:1.4px;
    }

    .new-chat{
      width:100%;
      height:46px;
      border:1px solid rgba(83,139,255,.22);
      background:linear-gradient(
        135deg,
        rgba(69,123,255,.14),
        rgba(69,123,255,.05)
      );
      border-radius:13px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      color:#eaf0ff;
      transition:.2s ease;
    }

    .new-chat:hover{
      border-color:rgba(83,139,255,.45);
      background:rgba(69,123,255,.14);
      transform:translateY(-1px);
    }

    .new-chat svg{
      width:18px;
      height:18px;
    }

    .side-section{
      margin-top:22px;
      color:#74778a;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:1.4px;
      padding:0 6px 9px;
    }

    .history{
      flex:1;
      overflow:auto;
      min-height:0;
    }

    .history::-webkit-scrollbar{
      width:4px;
    }

    .history::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.09);
      border-radius:10px;
    }

    .history-item{
      width:100%;
      text-align:left;
      padding:11px 10px;
      border-radius:10px;
      background:transparent;
      color:#cfd1dc;
      margin-bottom:3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      transition:.15s ease;
    }

    .history-item:hover{
      background:rgba(255,255,255,.045);
    }

    .history-item.active{
      background:rgba(74,126,255,.10);
      color:#fff;
    }

    .side-bottom{
      padding-top:10px;
      border-top:1px solid var(--line);
    }

    .side-row{
      display:flex;
      gap:6px;
    }

    .side-btn{
      flex:1;
      height:40px;
      background:transparent;
      border:1px solid transparent;
      border-radius:10px;
      color:#999cad;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:.18s ease;
    }

    .side-btn:hover{
      background:rgba(255,255,255,.045);
      color:#fff;
      border-color:var(--line);
    }

    .side-status{
      margin-top:9px;
      font-size:10px;
      color:#717487;
      padding:0 5px;
    }

    /* =========================
       MAIN
    ========================= */

    .main{
      position:relative;
      min-width:0;
      flex:1;
      height:100%;
      display:flex;
      flex-direction:column;
    }

    .topbar{
      position:relative;
      z-index:90;
      height:62px;
      flex:none;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 17px;
      border-bottom:1px solid var(--line);
      background:rgba(5,3,13,.74);
    }

    .top-left,
    .top-right{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .icon-btn{
      width:40px;
      height:40px;
      border-radius:11px;
      background:transparent;
      border:1px solid transparent;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#aeb2c4;
      transition:.18s ease;
    }

    .icon-btn:hover{
      color:#fff;
      background:rgba(255,255,255,.045);
      border-color:var(--line);
    }

    .icon-btn.active{
      color:#7eadff;
      background:rgba(72,130,255,.10);
      border-color:rgba(72,130,255,.20);
    }

    .icon-btn svg{
      width:19px;
      height:19px;
      stroke:currentColor;
      stroke-width:1.8;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .mode-select{
      height:38px;
      padding:0 34px 0 12px;
      color:#dfe3f1;
      background:#0c0b17;
      border:1px solid var(--line);
      border-radius:10px;
      outline:none;
    }

    .mode-select:focus{
      border-color:rgba(77,141,255,.45);
    }

    /* =========================
       CHAT
    ========================= */

    .chat{
      position:relative;
      flex:1;
      min-height:0;
      overflow:auto;
      padding:26px 18px 160px;
      scroll-behavior:smooth;
    }

    .chat::-webkit-scrollbar{
      width:5px;
    }

    .chat::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.08);
      border-radius:20px;
    }

    .welcome{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:40px 12px;
    }

    .welcome-inner{
      width:min(720px,100%);
    }

    .welcome-logo{
      width:70px;
      height:70px;
      border-radius:50%;
      background:#fff;
      margin:0 auto 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 0 50px rgba(67,127,255,.16);
    }

    .welcome-logo span{
      color:#080913;
      font-size:37px;
      font-weight:900;
      letter-spacing:-5px;
    }

    .welcome h1{
      margin:0;
      font-size:clamp(28px,5vw,46px);
      letter-spacing:-1.7px;
    }

    .welcome p{
      margin:9px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .quick-grid{
      margin-top:30px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:9px;
    }

    .quick{
      min-height:70px;
      padding:12px;
      text-align:left;
      border:1px solid var(--line);
      background:rgba(255,255,255,.018);
      border-radius:13px;
      color:#cdd0dc;
      transition:.18s ease;
    }

    .quick:hover{
      border-color:rgba(74,132,255,.35);
      background:rgba(74,132,255,.07);
      transform:translateY(-2px);
    }

    .quick-title{
      font-size:12px;
      font-weight:700;
      margin-bottom:4px;
    }

    .quick-desc{
      color:#777b8e;
      font-size:10px;
    }

    .message{
      width:min(860px,100%);
      margin:0 auto 20px;
      display:flex;
      gap:12px;
    }

    .message.user{
      justify-content:flex-end;
    }

    .message-bubble{
      max-width:min(760px,88%);
      padding:13px 15px;
      border-radius:16px;
      line-height:1.65;
      font-size:14px;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .message.assistant .message-bubble{
      background:rgba(255,255,255,.035);
      border:1px solid var(--line);
    }

    .message.user .message-bubble{
      background:rgba(68,124,255,.13);
      border:1px solid rgba(68,124,255,.18);
    }

    /* =========================
       COMPOSER
    ========================= */

    .composer-wrap{
      position:absolute;
      z-index:150;
      left:0;
      right:0;
      bottom:0;
      padding:15px 17px 18px;
      pointer-events:none;
      background:
        linear-gradient(
          to top,
          rgba(5,3,13,.98) 20%,
          rgba(5,3,13,.84) 68%,
          transparent
        );
    }

    .composer{
      position:relative;
      z-index:151;
      width:min(900px,100%);
      margin:auto;
      pointer-events:auto;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(11,10,22,.96);
      border-radius:19px;
      box-shadow:var(--shadow);
      overflow:visible;
    }

    .composer-main{
      display:flex;
      align-items:flex-end;
      gap:7px;
      padding:10px 10px 8px;
    }

    .message-input{
      flex:1;
      min-width:0;
      min-height:42px;
      max-height:150px;
      resize:none;
      border:0;
      outline:0;
      background:transparent;
      color:#f3f5ff;
      padding:10px 5px;
      line-height:1.5;
    }

    .message-input::placeholder{
      color:#6e7183;
    }

    .composer-tools{
      position:relative;
      z-index:200;
      display:flex;
      align-items:center;
      gap:3px;
      flex:none;
      pointer-events:auto !important;
    }

    .tool-btn{
      position:relative;
      z-index:201;
      width:38px;
      height:38px;
      flex:none;
      border-radius:10px;
      background:transparent;
      border:1px solid transparent;
      color:#8f93a6;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      pointer-events:auto !important;
      touch-action:manipulation;
      transition:
        color .16s ease,
        background .16s ease,
        border-color .16s ease,
        transform .16s ease;
    }

    .tool-btn:hover{
      color:#eef3ff;
      background:rgba(255,255,255,.055);
      border-color:rgba(255,255,255,.08);
    }

    .tool-btn:active{
      transform:scale(.93);
    }

    .tool-btn.active{
      color:#76aaff;
      background:rgba(76,139,255,.10);
      border-color:rgba(76,139,255,.20);
    }

    .tool-btn.recording{
      color:#ff7183;
      background:rgba(255,85,110,.10);
      border-color:rgba(255,85,110,.20);
      animation:recordPulse 1.1s ease-in-out infinite;
    }

    .tool-btn svg{
      width:18px;
      height:18px;
      stroke:currentColor;
      stroke-width:1.8;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
      pointer-events:none;
    }

    .tool-divider{
      width:1px;
      height:22px;
      margin:0 4px;
      background:var(--line);
    }

    @keyframes recordPulse{
      0%,100%{box-shadow:0 0 0 rgba(255,85,110,0)}
      50%{box-shadow:0 0 18px rgba(255,85,110,.18)}
    }

    .send-btn{
      position:relative;
      z-index:205;
      width:40px;
      height:40px;
      flex:none;
      border-radius:11px;
      background:#f4f7ff;
      color:#080913;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      pointer-events:auto !important;
      touch-action:manipulation;
      transition:.18s ease;
    }

    .send-btn:hover{
      transform:translateY(-1px);
      box-shadow:0 6px 20px rgba(255,255,255,.12);
    }

    .send-btn:active{
      transform:scale(.93);
    }

    .send-btn:disabled{
      opacity:.42;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
    }

    .send-btn svg{
      width:18px;
      height:18px;
      stroke:currentColor;
      stroke-width:2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
      pointer-events:none;
    }

    .composer-bottom{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 13px 9px;
      color:#64687a;
      font-size:9px;
    }

    #composerStatus{
      min-height:12px;
    }

    /* =========================
       OVERLAY
       ========================= */

    #overlay{
      position:fixed;
      inset:0;
      z-index:80;
      display:none;
      background:rgba(0,0,0,.32);
      /* NO BLUR */
      backdrop-filter:none !important;
      -webkit-backdrop-filter:none !important;
    }

    #overlay.show{
      display:block;
    }

    /* =========================
       SETTINGS
    ========================= */

    .modal{
      position:fixed;
      inset:0;
      z-index:500;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(0,0,0,.48);
    }

    .modal.show{
      display:flex;
    }

    .modal-card{
      width:min(520px,100%);
      max-height:90vh;
      overflow:auto;
      background:#0c0b17;
      border:1px solid var(--line2);
      border-radius:20px;
      box-shadow:0 30px 100px rgba(0,0,0,.6);
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:17px 18px;
      border-bottom:1px solid var(--line);
    }

    .modal-head h2{
      margin:0;
      font-size:16px;
    }

    .close-btn{
      width:34px;
      height:34px;
      border-radius:9px;
      background:transparent;
      color:#8c90a2;
    }

    .close-btn:hover{
      background:rgba(255,255,255,.05);
      color:#fff;
    }

    .settings-body{
      padding:16px;
    }

    .setting{
      margin-bottom:16px;
    }

    .setting label{
      display:block;
      margin-bottom:7px;
      color:#aeb1c0;
      font-size:11px;
    }

    .setting select{
      width:100%;
      height:42px;
      border-radius:10px;
      border:1px solid var(--line);
      background:#090814;
      color:#e9ebf5;
      outline:none;
      padding:0 11px;
    }

    .danger-btn{
      width:100%;
      height:42px;
      border-radius:10px;
      background:rgba(255,80,104,.08);
      border:1px solid rgba(255,80,104,.15);
      color:#ff8797;
    }

    .danger-btn:hover{
      background:rgba(255,80,104,.13);
    }

    /* =========================
       MOBILE
    ========================= */

    #menuBtn{
      display:none;
    }

    @media(max-width:800px){
      .sidebar{
        position:fixed;
        left:0;
        top:0;
        bottom:0;
        z-index:300;
        transform:translateX(-105%);
        box-shadow:20px 0 70px rgba(0,0,0,.4);
      }

      .sidebar.open{
        transform:translateX(0);
      }

      #menuBtn{
        display:flex;
      }

      .quick-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .chat{
        padding-left:12px;
        padding-right:12px;
        padding-bottom:165px;
      }

      .composer-wrap{
        padding:10px 9px 11px;
      }

      .composer{
        border-radius:17px;
      }

      .tool-btn{
        width:35px;
        height:35px;
      }

      .send-btn{
        width:38px;
        height:38px;
      }

      .mode-select{
        max-width:110px;
      }
    }

    @media(max-width:430px){
      .topbar{
        padding:0 9px;
      }

      .top-right{
        gap:3px;
      }

      .mode-select{
        max-width:95px;
        padding-left:8px;
        padding-right:22px;
      }

      .composer-main{
        gap:3px;
        padding-left:7px;
        padding-right:7px;
      }

      .tool-divider{
        margin:0 1px;
      }

      .tool-btn{
        width:32px;
        height:34px;
      }

      .send-btn{
        width:37px;
        height:37px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       CINEMATIC INTRO
  ========================= -->

  <div id="weuraIntro">
    <div class="intro-core">
      <div class="intro-ring"></div>
      <div class="intro-ring"></div>
      <div class="intro-ring"></div>

      <div class="intro-logo">
        <span>W</span>
      </div>
    </div>
  </div>

  <!-- =========================
       APP
  ========================= -->

  <div id="weuraApp">

    <div class="app-shell">

      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">

        <div class="brand">
          <div class="brand-logo">
            <span>W</span>
          </div>

          <div>
            <div class="brand-name">WEURA AI</div>
            <div class="brand-tag">THINK BEYOND.</div>
          </div>
        </div>

        <button class="new-chat" id="newChatBtn" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>New chat</span>
        </button>

        <div class="side-section">History</div>

        <div class="history" id="historyList"></div>

        <div class="side-bottom">

          <div class="side-row">

            <button class="side-btn" id="settingsBtn" type="button" aria-label="Settings">
              <svg viewBox="0 0 24 24">
                <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/>
                <path d="M19 13.5a7.7 7.7 0 0 0 0-3l2-1.4-2-3.4-2.3.8a7.5 7.5 0 0 0-2.6-1.5L13.8 2h-3.6l-.3 3a7.5 7.5 0 0 0-2.6 1.5L5 5.7 3 9.1l2 1.4a7.7 7.7 0 0 0 0 3l-2 1.4 2 3.4 2.3-.8a7.5 7.5 0 0 0 2.6 1.5l.3 3h3.6l.3-3a7.5 7.5 0 0 0 2.6-1.5l2.3.8 2-3.4-2-1.4Z"/>
              </svg>
            </button>

            <button class="side-btn" id="themeBtn" type="button" aria-label="Theme">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
              </svg>
            </button>

          </div>

          <div class="side-status">
            <span id="statusText">Connecting...</span>
          </div>

        </div>

      </aside>

      <!-- MAIN -->
      <main class="main">

        <header class="topbar">

          <div class="top-left">

            <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu">
              <svg viewBox="0 0 24 24">
                <path d="M4 7h16M4 12h16M4 17h16"/>
              </svg>
            </button>

            <select class="mode-select" id="modeSelect">
              <option value="auto">Auto</option>
              <option value="smart">Smart</option>
              <option value="research">Research</option>
              <option value="code">Code</option>
              <option value="creative">Creative</option>
              <option value="vision">Vision</option>
              <option value="fast">Fast</option>
            </select>

          </div>

          <div class="top-right">

            <button class="icon-btn" id="searchToggle" type="button" aria-label="Smart search">
              <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="6.5"/>
                <path d="m16 16 5 5"/>
              </svg>
            </button>

            <button class="icon-btn" id="themeTopBtn" type="button" aria-label="Theme">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
              </svg>
            </button>

          </div>

        </header>

        <section class="chat" id="messages">

          <div class="welcome" id="welcome">

            <div class="welcome-inner">

              <div class="welcome-logo">
                <span>W</span>
              </div>

              <h1>Think Beyond.</h1>
              <p>WEURA AI is ready.</p>

              <div class="quick-grid">

                <button class="quick" type="button" data-action="ask">
                  <div class="quick-title">Ask WEURA</div>
                  <div class="quick-desc">Get a smart answer</div>
                </button>

                <button class="quick" type="button" data-action="research">
                  <div class="quick-title">Research</div>
                  <div class="quick-desc">Explore a topic</div>
                </button>

                <button class="quick" type="button" data-action="code">
                  <div class="quick-title">Coding</div>
                  <div class="quick-desc">Build and debug</div>
                </button>

                <button class="quick" type="button" data-action="creative">
                  <div class="quick-title">Creative</div>
                  <div class="quick-desc">Create something new</div>
                </button>

              </div>

            </div>

          </div>

        </section>

        <!-- COMPOSER -->
        <div class="composer-wrap">

          <div class="composer">

            <div class="composer-main">

              <textarea
                id="messageInput"
                class="message-input"
                rows="1"
                placeholder="Message WEURA..."
                autocomplete="off"
                spellcheck="true"
              ></textarea>

              <div class="composer-tools">

                <!-- FILE -->
                <button
                  class="tool-btn"
                  id="fileBtn"
                  type="button"
                  aria-label="Attach file"
                  title="Attach file"
                >
                  <svg viewBox="0 0 24 24">
                    <path d="M12 5v14M5 12h14"/>
                  </svg>
                </button>

                <!-- IMAGE -->
                <button
                  class="tool-btn"
                  id="imageBtn"
                  type="button"
                  aria-label="Analyze image"
                  title="Analyze image"
                >
                  <svg viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="16" rx="2"/>
                    <circle cx="8.5" cy="9" r="1.5"/>
                    <path d="m4 17 5-5 4 4 2-2 5 5"/>
                  </svg>
                </button>

                <!-- CAMERA -->
                <button
                  class="tool-btn"
                  id="cameraBtn"
                  type="button"
                  aria-label="Camera"
                  title="Camera"
                >
                  <svg viewBox="0 0 24 24">
                    <path d="M4 7h3l1.5-2h7L17 7h3a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 19H4a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 4 7Z"/>
                    <circle cx="12" cy="13" r="3.2"/>
                  </svg>
                </button>

                <div class="tool-divider"></div>

                <!-- MICROPHONE -->
                <button
                  class="tool-btn"
                  id="voiceBtn"
                  type="button"
                  aria-label="Voice input"
                  title="Voice input"
                >
                  <svg viewBox="0 0 24 24">
                    <rect x="9" y="3" width="6" height="12" rx="3"/>
                    <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/>
                  </svg>
                </button>

                <!-- STOP -->
                <button
                  class="tool-btn"
                  id="stopBtn"
                  type="button"
                  aria-label="Stop"
                  title="Stop"
                  style="display:none"
                >
                  <svg viewBox="0 0 24 24">
                    <rect x="7" y="7" width="10" height="10" rx="2"/>
                  </svg>
                </button>

                <!-- SEND -->
                <button
                  class="send-btn"
                  id="sendBtn"
                  type="button"
                  aria-label="Send"
                  title="Send"
                >
                  <svg viewBox="0 0 24 24">
                    <path d="M4 12 20 4l-5 16-3-7-8-1Z"/>
                    <path d="m12 13 8-9"/>
                  </svg>
                </button>

              </div>

            </div>

            <div class="composer-bottom">
              <span id="composerStatus"></span>
              <span>WEURA AI</span>
            </div>

          </div>

        </div>

      </main>

    </div>

  </div>

  <!-- NO BLUR OVERLAY -->
  <div id="overlay"></div>

  <!-- SETTINGS -->
  <div class="modal" id="settingsModal">

    <div class="modal-card">

      <div class="modal-head">
        <h2>Settings</h2>

        <button class="close-btn" id="closeSettings" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path d="m6 6 12 12M18 6 6 18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="settings-body">

        <div class="setting">
          <label for="languageSetting">Language</label>
          <select id="languageSetting">
            <option value="en">English</option>
            <option value="ar">Arabic</option>
            <option value="fr">French</option>
            <option value="auto">Auto</option>
          </select>
        </div>

        <div class="setting">
          <label for="directionSetting">Direction</label>
          <select id="directionSetting">
            <option value="ltr">Left to right</option>
            <option value="rtl">Right to left</option>
            <option value="auto">Automatic</option>
          </select>
        </div>

        <div class="setting">
          <label for="themeSetting">Theme</label>
          <select id="themeSetting">
            <option value="auto">System</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>

        <div class="setting">
          <label for="detailSetting">Response detail</label>
          <select id="detailSetting">
            <option value="auto">Automatic</option>
            <option value="concise">Concise</option>
            <option value="balanced">Balanced</option>
            <option value="detailed">Detailed</option>
          </select>
        </div>

        <button class="danger-btn" id="clearMemoryBtn" type="button">
          Clear memory
        </button>

      </div>

    </div>

  </div>

  <!-- INPUTS -->
  <input
    id="fileInput"
    type="file"
    hidden
    multiple
  >

  <input
    id="imageInput"
    type="file"
    accept="image/*"
    capture="environment"
    hidden
  >

  <input
    id="cameraInput"
    type="file"
    accept="image/*"
    capture="environment"
    hidden
  >

  <!-- CHAT JS -->
  <script src="chat.js?v=7000" defer></script>

  <!-- BOOT -->
  <script>
    (() => {
      const intro = document.getElementById("weuraIntro");
      const app = document.getElementById("weuraApp");

      function enterWEURA(){
        if(!intro || !app) return;

        app.classList.add("ready");
        intro.classList.add("hide");

        setTimeout(() => {
          intro.style.display = "none";
          intro.style.pointerEvents = "none";
        }, 750);
      }

      setTimeout(enterWEURA, 2200);
      setTimeout(enterWEURA, 4000);
      setTimeout(enterWEURA, 5500);
    })();
  </script>

</body>
</html>
