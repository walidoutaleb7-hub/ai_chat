<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#03050a"
>

<meta
  name="description"
  content="WEURA AI — Think Beyond."
>

<title>WEURA AI — Think Beyond.</title>


<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --bg:#05070d;
  --panel:#0a0e17;
  --panel2:#0f1522;
  --panel3:#151c2b;

  --text:#f4f7ff;
  --muted:#8996aa;

  --border:rgba(255,255,255,.075);

  --accent:#3d8bff;
  --accent2:#72b0ff;

  --danger:#ff5c6c;
  --success:#62dda0;

  --shadow:0 25px 80px rgba(0,0,0,.38);

  --radius:18px;
}


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;

  background:var(--bg);
  color:var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}


/* =========================================================
   INTRO
========================================================= */

#weuraIntro{

  position:fixed;

  inset:0;

  z-index:999999;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(61,139,255,.16),
      transparent 30%
    ),
    radial-gradient(
      circle at 50% 50%,
      #0a1020 0%,
      #03050a 55%,
      #010205 100%
    );

  opacity:1;

  visibility:visible;

  pointer-events:auto;

  transition:
    opacity .75s ease,
    visibility .75s ease;
}

#weuraIntro.hide{

  opacity:0;

  visibility:hidden;

  pointer-events:none;
}

.intro-grid{

  position:absolute;

  inset:0;

  background-image:
    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 1px,
      transparent 1px
    );

  background-size:45px 45px;

  mask-image:
    radial-gradient(
      circle at center,
      black,
      transparent 75%
    );

  animation:introGrid 8s linear infinite;
}

@keyframes introGrid{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(45px);
  }
}

.intro-orbit{

  position:absolute;

  width:min(70vw,480px);
  height:min(70vw,480px);

  border:
    1px solid
    rgba(61,139,255,.13);

  border-radius:50%;

  animation:
    orbit 13s linear infinite;
}

.intro-orbit::before{

  content:"";

  position:absolute;

  width:7px;
  height:7px;

  border-radius:50%;

  background:#6aa9ff;

  box-shadow:
    0 0 20px #3d8bff,
    0 0 50px rgba(61,139,255,.7);

  top:12%;
  left:50%;
}

.intro-orbit.two{

  width:min(55vw,370px);
  height:min(55vw,370px);

  border-color:
    rgba(114,176,255,.08);

  animation:
    orbitReverse 10s linear infinite;
}

@keyframes orbit{

  to{
    transform:rotate(360deg);
  }
}

@keyframes orbitReverse{

  to{
    transform:rotate(-360deg);
  }
}

.intro-content{

  position:relative;

  z-index:3;

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  animation:
    introContent 1.1s
    cubic-bezier(.2,.8,.2,1);
}

@keyframes introContent{

  from{
    opacity:0;
    transform:
      scale(.88)
      translateY(15px);
  }

  to{
    opacity:1;
    transform:
      scale(1)
      translateY(0);
  }
}

.intro-logo{

  position:relative;

  width:106px;
  height:106px;

  border-radius:50%;

  background:#fff;

  display:grid;

  place-items:center;

  box-shadow:
    0 0 0 1px rgba(255,255,255,.15),
    0 0 45px rgba(61,139,255,.22),
    0 0 110px rgba(61,139,255,.13);
}

.intro-logo::before,
.intro-logo::after{

  content:"";

  position:absolute;

  border-radius:50%;

  border:
    1px solid
    rgba(61,139,255,.15);

  animation:
    pulseRing 2.5s ease-out infinite;
}

.intro-logo::before{
  inset:-13px;
}

.intro-logo::after{

  inset:-27px;

  animation-delay:.8s;
}

@keyframes pulseRing{

  0%{
    opacity:.8;
    transform:scale(.92);
  }

  100%{
    opacity:0;
    transform:scale(1.12);
  }
}

.intro-logo span{

  color:#05070d;

  font-size:57px;

  font-weight:950;

  letter-spacing:-7px;

  transform:
    translateX(-3px);
}

.intro-name{

  margin-top:31px;

  font-size:
    clamp(31px,8vw,54px);

  font-weight:900;

  letter-spacing:
    clamp(2px,1vw,7px);
}

.intro-tagline{

  margin-top:9px;

  color:#91a0b8;

  font-size:
    clamp(12px,3vw,15px);

  letter-spacing:4px;
}

.intro-line{

  width:min(280px,60vw);

  height:1px;

  margin-top:25px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #3d8bff,
      transparent
    );
}


/* =========================================================
   APPLICATION
========================================================= */

#weuraApp{

  width:100%;
  height:100%;

  opacity:0;

  transform:scale(1.015);

  pointer-events:none;

  transition:
    opacity .75s ease,
    transform .9s cubic-bezier(.2,.8,.2,1);
}

#weuraApp.ready{

  opacity:1;

  transform:scale(1);

  pointer-events:auto;
}

.app{

  width:100%;
  height:100%;

  display:flex;

  background:var(--bg);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

  width:285px;
  height:100%;

  flex-shrink:0;

  background:var(--panel);

  border-left:
    1px solid var(--border);

  display:flex;

  flex-direction:column;

  z-index:30;

  transition:
    transform .25s ease;
}

html[dir="ltr"] .sidebar{

  border-left:0;

  border-right:
    1px solid var(--border);
}

.brand{

  padding:22px 18px;

  display:flex;

  align-items:center;

  gap:12px;
}

.logo{

  width:43px;
  height:43px;

  border-radius:50%;

  background:#fff;

  display:grid;

  place-items:center;

  flex-shrink:0;

  box-shadow:
    0 0 30px
    rgba(61,139,255,.18);
}

.logo span{

  color:#05070d;

  font-weight:950;

  font-size:23px;

  letter-spacing:-2px;
}

.brand-title{

  font-size:17px;

  font-weight:850;
}

.brand-subtitle{

  color:var(--muted);

  font-size:11px;

  margin-top:2px;
}

.new-chat{

  margin:
    0 15px 12px;

  padding:
    12px 14px;

  border-radius:13px;

  background:var(--panel3);

  color:var(--text);

  border:
    1px solid
    var(--border);

  display:flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  transition:.2s;
}

.new-chat:hover{

  background:#192237;

  border-color:
    rgba(61,139,255,.35);
}

.history{

  flex:1;

  overflow-y:auto;

  padding:
    8px 12px;
}

.history-title{

  color:var(--muted);

  font-size:11px;

  padding:8px;
}

.history-item{

  width:100%;

  text-align:right;

  padding:
    11px 12px;

  margin-bottom:4px;

  border-radius:11px;

  color:#cbd4e5;

  background:transparent;

  cursor:pointer;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  transition:.18s;
}

.history-item:hover,
.history-item.active{

  background:var(--panel3);

  color:white;
}

.sidebar-bottom{

  padding:12px;

  border-top:
    1px solid
    var(--border);
}

.side-row{

  display:flex;

  gap:7px;
}

.side-button{

  flex:1;

  padding:10px 8px;

  border-radius:11px;

  background:transparent;

  color:var(--muted);

  transition:.2s;
}

.side-button:hover{

  background:var(--panel3);

  color:white;
}

.status{

  margin-top:8px;

  font-size:11px;

  color:var(--muted);

  text-align:center;
}

.status.online{
  color:var(--success);
}

.status.offline{
  color:var(--danger);
}


/* =========================================================
   MAIN
========================================================= */

.main{

  min-width:0;

  flex:1;

  height:100%;

  display:flex;

  flex-direction:column;

  position:relative;
}

.topbar{

  height:65px;

  flex-shrink:0;

  border-bottom:
    1px solid
    var(--border);

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    0 17px;

  background:
    rgba(5,7,13,.82);

  backdrop-filter:blur(18px);

  z-index:10;
}

.top-left,
.top-right{

  display:flex;

  align-items:center;

  gap:8px;
}

.icon-btn{

  width:39px;
  height:39px;

  border-radius:11px;

  background:transparent;

  color:var(--muted);

  display:grid;

  place-items:center;

  transition:.2s;
}

.icon-btn:hover{

  background:var(--panel3);

  color:white;
}

.mode-select{

  background:var(--panel2);

  color:white;

  border:
    1px solid
    var(--border);

  border-radius:11px;

  padding:
    9px 11px;

  outline:none;
}

.search-btn.active{

  color:var(--accent2);

  background:
    rgba(61,139,255,.1);
}


/* =========================================================
   CHAT
========================================================= */

.chat{

  flex:1;

  overflow-y:auto;

  padding:
    25px 18px 170px;

  scroll-behavior:smooth;
}

.chat-inner{

  width:min(900px,100%);

  margin:auto;
}

.welcome{

  min-height:62vh;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  padding:20px;
}

.welcome-logo{

  width:74px;
  height:74px;

  border-radius:50%;

  background:#fff;

  display:grid;

  place-items:center;

  margin-bottom:20px;

  box-shadow:
    0 0 55px
    rgba(61,139,255,.16);
}

.welcome-logo span{

  color:#05070d;

  font-weight:950;

  font-size:39px;

  letter-spacing:-4px;
}

.welcome h1{

  margin:0;

  font-size:
    clamp(28px,5vw,42px);

  letter-spacing:-1.5px;
}

.welcome p{

  color:var(--muted);

  margin:
    9px 0 26px;
}

.quick-actions{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:9px;

  width:min(760px,100%);
}

.quick{

  text-align:start;

  padding:14px;

  border-radius:14px;

  background:var(--panel);

  border:
    1px solid
    var(--border);

  color:white;

  transition:.2s;
}

.quick:hover{

  border-color:
    rgba(61,139,255,.35);

  transform:
    translateY(-1px);
}

.quick strong{

  display:block;

  font-size:13px;

  margin-bottom:4px;
}

.quick small{

  color:var(--muted);

  font-size:10px;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{

  display:flex;

  gap:12px;

  margin:20px 0;
}

.message.user,
.message.assistant{

  justify-content:flex-start;
}

.avatar{

  width:32px;
  height:32px;

  border-radius:50%;

  flex-shrink:0;

  display:grid;

  place-items:center;

  font-size:12px;

  font-weight:900;
}

.assistant .avatar{

  background:white;

  color:#05070d;
}

.user .avatar{

  background:#1a2436;

  color:#bcd2ff;
}

.message-body{

  min-width:0;

  max-width:
    min(760px,88%);
}

.message-content{

  white-space:pre-wrap;

  word-break:break-word;

  line-height:1.72;

  font-size:15px;
}

.message-actions{

  display:flex;

  gap:4px;

  margin-top:7px;
}

.message-actions button{

  padding:
    4px 7px;

  border-radius:7px;

  background:transparent;

  color:#65738a;

  font-size:11px;
}

.message-actions button:hover{

  color:white;

  background:
    var(--panel3);
}


/* =========================================================
   COMPOSER
========================================================= */

.composer-wrap{

  position:absolute;

  bottom:0;
  left:0;
  right:0;

  padding:
    15px 17px 17px;

  background:
    linear-gradient(
      to top,
      var(--bg) 65%,
      transparent
    );

  z-index:8;
}

.composer{

  width:min(900px,100%);

  margin:auto;

  background:var(--panel);

  border:
    1px solid
    var(--border);

  border-radius:19px;

  box-shadow:var(--shadow);

  overflow:hidden;
}

.composer-tools{

  display:flex;

  align-items:center;

  gap:5px;

  padding:
    9px 10px 2px;
}

.tool-btn{

  width:38px;
  height:38px;

  border-radius:11px;

  display:grid;

  place-items:center;

  background:transparent;

  color:#7d8aa0;

  transition:
    color .2s ease,
    background .2s ease,
    transform .2s ease;
}

.tool-btn svg{

  width:19px;
  height:19px;

  fill:none;

  stroke:currentColor;

  stroke-width:1.8;

  stroke-linecap:round;

  stroke-linejoin:round;
}

.tool-btn:hover{

  color:#dce9ff;

  background:
    rgba(255,255,255,.055);

  transform:
    translateY(-1px);
}

.tool-btn:active{

  transform:
    scale(.93);
}

.tool-btn.active{

  color:var(--accent2);

  background:
    rgba(61,139,255,.11);
}

.tool-btn.recording{

  color:#72b0ff;

  background:
    rgba(61,139,255,.13);
}

.tool-divider{

  width:1px;
  height:20px;

  background:
    rgba(255,255,255,.07);

  margin:
    0 3px;
}

.tool-spacer{
  flex:1;
}

textarea{

  width:100%;

  min-height:54px;
  max-height:190px;

  resize:none;

  border:0;
  outline:none;

  background:transparent;

  color:white;

  padding:
    12px 14px 8px;

  line-height:1.55;
}

textarea::placeholder{
  color:#69758a;
}

.composer-bottom{

  display:flex;

  justify-content:flex-end;

  align-items:center;

  padding:
    5px 9px 9px;
}

.composer-status{

  flex:1;

  color:var(--muted);

  font-size:10px;

  padding-right:7px;
}

.send-btn,
.stop-btn{

  width:39px;
  height:39px;

  border-radius:12px;

  display:grid;

  place-items:center;
}

.send-btn{

  background:white;

  color:#05070d;

  transition:.2s;
}

.send-btn:hover{

  transform:
    translateY(-1px);

  box-shadow:
    0 5px 20px
    rgba(255,255,255,.12);
}

.send-btn:active{

  transform:
    scale(.92);
}

.stop-btn{

  background:#28151a;

  color:#ff7584;

  display:none;
}


/* =========================================================
   OVERLAY
========================================================= */

.overlay{

  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.55);

  backdrop-filter:blur(5px);

  z-index:40;

  display:none;

  pointer-events:none;
}

.overlay.show{

  display:block;

  pointer-events:auto;
}


/* =========================================================
   MODAL
========================================================= */

.modal{

  position:fixed;

  z-index:50;

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%);

  width:min(
    620px,
    calc(100% - 28px)
  );

  max-height:85vh;

  overflow-y:auto;

  background:#0b101a;

  border:
    1px solid
    var(--border);

  border-radius:22px;

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.6);

  display:none;
}

.modal.show{
  display:block;
}

.modal-header{

  padding:19px;

  border-bottom:
    1px solid
    var(--border);

  display:flex;

  align-items:center;

  justify-content:space-between;
}

.modal-body{
  padding:19px;
}

.setting{
  margin-bottom:18px;
}

.setting label{

  display:block;

  font-size:12px;

  color:var(--muted);

  margin-bottom:7px;
}

.setting select,
.setting input{

  width:100%;

  background:var(--panel2);

  border:
    1px solid
    var(--border);

  color:white;

  border-radius:11px;

  padding:11px;

  outline:none;
}


/* =========================================================
   LIGHT MODE
========================================================= */

body.light{

  --bg:#f7f9fc;

  --panel:#ffffff;

  --panel2:#f0f3f8;

  --panel3:#e7ecf4;

  --text:#111827;

  --muted:#68758a;

  --border:
    rgba(15,23,42,.09);

  --shadow:
    0 20px 70px
    rgba(15,23,42,.12);
}

body.light .topbar{

  background:
    rgba(247,249,252,.85);
}

body.light textarea,
body.light .message-content{

  color:#111827;
}

body.light .quick,
body.light .composer{

  background:white;
}

body.light .modal{

  background:white;
}

body.light .setting select,
body.light .setting input{

  background:#f3f5f9;

  color:#111827;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){

  .sidebar{

    position:fixed;

    top:0;
    bottom:0;
    right:0;

    transform:
      translateX(105%);

    box-shadow:
      -20px 0 70px
      rgba(0,0,0,.45);
  }

  html[dir="ltr"] .sidebar{

    right:auto;
    left:0;

    transform:
      translateX(-105%);
  }

  .sidebar.open{

    transform:
      translateX(0);
  }

  .topbar{
    height:59px;
  }

  .quick-actions{

    grid-template-columns:
      repeat(2,1fr);
  }

  .chat{

    padding:
      11px 11px 155px;
  }

  .composer-wrap{

    padding:9px;
  }

  .message-body{
    max-width:86%;
  }

  .intro-logo{

    width:88px;
    height:88px;
  }

  .intro-logo span{
    font-size:47px;
  }

  .tool-btn{

    width:36px;
    height:36px;
  }

  .tool-btn svg{

    width:18px;
    height:18px;
  }
}

@media(max-width:430px){

  .quick-actions{

    grid-template-columns:
      1fr 1fr;
  }

  .quick{
    padding:11px;
  }

  .quick small{
    display:none;
  }

  .intro-tagline{
    letter-spacing:2px;
  }
}

</style>

</head>


<body>


<!-- =========================================================
     INTRO
========================================================= -->

<div id="weuraIntro">

  <div class="intro-grid"></div>

  <div class="intro-orbit"></div>

  <div class="intro-orbit two"></div>

  <div class="intro-content">

    <div class="intro-logo">
      <span>W</span>
    </div>

    <div class="intro-name">
      WEURA AI
    </div>

    <div class="intro-tagline">
      THINK BEYOND.
    </div>

    <div class="intro-line"></div>

  </div>

</div>


<!-- =========================================================
     APPLICATION
========================================================= -->

<div id="weuraApp">

<div class="app">


<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside
  id="sidebar"
  class="sidebar"
>

  <div class="brand">

    <div class="logo">
      <span>W</span>
    </div>

    <div>

      <div class="brand-title">
        WEURA AI
      </div>

      <div class="brand-subtitle">
        Think Beyond.
      </div>

    </div>

  </div>


  <button
    type="button"
    id="newChatBtn"
    class="new-chat"
  >

    <svg
      width="17"
      height="17"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
    >

      <path d="M12 5v14"/>
      <path d="M5 12h14"/>

    </svg>

    <span>
      محادثة جديدة
    </span>

  </button>


  <div class="history">

    <div class="history-title">
      المحادثات
    </div>

    <div id="historyList"></div>

  </div>


  <div class="sidebar-bottom">

    <div class="side-row">

      <button
        type="button"
        id="settingsBtn"
        class="side-button"
      >
        الإعدادات
      </button>

      <button
        type="button"
        id="themeBtn"
        class="side-button"
      >
        المظهر
      </button>

    </div>

    <div
      id="statusText"

<!-- =========================================================
     UI BOOT
========================================================= -->

<script>

(function(){

  "use strict";


  let started = false;


  function showApp(){

    if(started) return;

    started = true;


    const intro =
      document.getElementById(
        "weuraIntro"
      );

    const app =
      document.getElementById(
        "weuraApp"
      );


    if(intro){

      intro.classList.add(
        "hide"
      );

      intro.style.pointerEvents =
        "none";

    }


    if(app){

      app.classList.add(
        "ready"
      );

      app.style.pointerEvents =
        "auto";

    }


    setTimeout(function(){

      if(intro){

        intro.style.display =
          "none";

      }

    },850);

  }


  /*
    الدخول الطبيعي
  */

  setTimeout(
    showApp,
    1800
  );


  /*
    حماية
  */

  setTimeout(
    showApp,
    3000
  );


  /*
    حماية نهائية
  */

  setTimeout(function(){

    const intro =
      document.getElementById(
        "weuraIntro"
      );

    const app =
      document.getElementById(
        "weuraApp"
      );


    if(intro){

      intro.classList.add(
        "hide"
      );

      intro.style.display =
        "none";

      intro.style.pointerEvents =
        "none";

    }


    if(app){

      app.classList.add(
        "ready"
      );

      app.style.opacity =
        "1";

      app.style.transform =
        "scale(1)";

      app.style.pointerEvents =
        "auto";

    }

  },4200);


  /*
    مراقبة تحميل chat.js
  */

  setTimeout(function(){

    if(
      window.WEURA_CHAT_LOAD_ERROR
    ){

      console.error(
        "[WEURA] chat.js لم يتم تحميله."
      );

    }

  },1500);


  /*
    لا نخلي overlay يقدر يحبس الواجهة
    إذا ما كانش مفتوح فعلياً.
  */

  const overlay =
    document.getElementById(
      "overlay"
    );

  if(overlay){

    overlay.addEventListener(
      "click",
      function(){

        overlay.classList.remove(
          "show"
        );

        const sidebar =
          document.getElementById(
            "sidebar"
          );

        const modal =
          document.getElementById(
            "settingsModal"
          );

        sidebar?.classList.remove(
          "open"
        );

        modal?.classList.remove(
          "show"
        );

      }
    );

  }


  /*
    Bridge احتياطي للواجهة.
    
    هذا لا يستبدل chat.js.
    فقط يضمن أن أزرار الواجهة الأساسية
    تبقى قابلة للتفاعل حتى لو صار خلل
    في تهيئة المحرك.
  */

  function bridge(id, callback){

    const element =
      document.getElementById(id);

    if(!element) return;

    element.addEventListener(
      "click",
      function(event){

        /*
          إذا chat.js هو المسؤول
          عن الزر، نخليه يتصرف.
        */

        if(
          window.WEURA &&
          window.WEURA.initialized
        ){

          return;

        }

        try{

          callback(event);

        }catch(error){

          console.error(
            "[WEURA UI]",
            error
          );

        }

      }
    );

  }


  /*
    MENU
  */

  bridge(
    "menuBtn",
    function(){

      document
        .getElementById("sidebar")
        ?.classList
        .add("open");

      document
        .getElementById("overlay")
        ?.classList
        .add("show");

    }
  );


  /*
    SETTINGS
  */

  bridge(
    "settingsBtn",
    function(){

      document
        .getElementById(
          "settingsModal"
        )
        ?.classList
        .add("show");

      document
        .getElementById("overlay")
        ?.classList
        .add("show");

    }
  );


  /*
    CLOSE SETTINGS
  */

  bridge(
    "closeSettings",
    function(){

      document
        .getElementById(
          "settingsModal"
        )
        ?.classList
        .remove("show");

      document
        .getElementById("overlay")
        ?.classList
        .remove("show");

    }
  );


  /*
    THEME
  */

  bridge(
    "themeBtn",
    function(){

      document.body.classList.toggle(
        "light"
      );

    }
  );


  bridge(
    "themeTopBtn",
    function(){

      document.body.classList.toggle(
        "light"
      );

    }
  );


  /*
    SEARCH
  */

  bridge(
    "searchToggle",
    function(){

      const button =
        document.getElementById(
          "searchToggle"
        );

      button?.classList.toggle(
        "active"
      );

    }
  );


  /*
    QUICK ACTIONS
  */

  document
    .querySelectorAll(".quick")
    .forEach(function(button){

      button.addEventListener(
        "click",
        function(){

          const input =
            document.getElementById(
              "messageInput"
            );

          if(!input) return;

          input.value =
            button.dataset.prompt ||
            "";

          input.focus();

          input.dispatchEvent(
            new Event(
              "input",
              {
                bubbles:true
              }
            )
          );

        }
      );

    });


  /*
    New Chat fallback
  */

  bridge(
    "newChatBtn",
    function(){

      const input =
        document.getElementById(
          "messageInput"
        );

      if(input){

        input.value = "";

        input.focus();

      }

      const messages =
        document.getElementById(
          "messages"
        );

      if(messages){

        messages.scrollTop = 0;

      }

    }
  );


  /*
    SEND fallback:
    إذا chat.js ما خدمش، على الأقل
    الزر ما يبقاش ميت بصرياً.
  */

  bridge(
    "sendBtn",
    function(){

      const input =
        document.getElementById(
          "messageInput"
        );

      if(!input) return;

      const text =
        input.value.trim();

      if(!text) return;

      console.warn(
        "[WEURA] chat.js غير متاح — الرسالة لم ترسل للخادم."
      );

    }
  );


  console.log(
    "[WEURA] index.html UI booted successfully."
  );


})();

</script>
