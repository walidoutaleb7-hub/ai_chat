name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Backup pubspec
        working-directory: WEURA
        run: cp pubspec.yaml /tmp/pubspec.yaml.bak

      - name: Create Android project
        working-directory: WEURA
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=weura --org com.weura --no-pub

      - name: Restore pubspec
        working-directory: WEURA
        run: cp /tmp/pubspec.yaml.bak pubspec.yaml

      - name: Copy logo assets
        working-directory: WEURA
        run: |
          mkdir -p assets/logo
          cp assets/icons/weura.svg assets/logo/weura.svg
          cp assets/icons/app_icon.png assets/logo/app_icon.png

      - name: Fix Android
        working-directory: WEURA/android
        run: |
          sed -i 's/version "1.9.0"/version "2.1.0"/' settings.gradle
          sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' app/build.gradle
          sed -i 's/minSdk = [0-9]*/minSdk = 24/' app/build.gradle
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/' app/build.gradle

      - name: Get dependencies
        working-directory: WEURA
        run: flutter pub get

      - name: Build APK
        working-directory: WEURA
        run: flutter build apk --release --target=app/main.dart

      - uses: actions/upload-artifact@v4
        with:
          name: weura-apk
          path: WEURA/build/app/outputs/flutter-apk/app-release.apk