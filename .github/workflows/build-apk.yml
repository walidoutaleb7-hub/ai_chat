name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Backup pubspec
        working-directory: WEURA
        run: cp pubspec.yaml /tmp/pubspec.bak

      - name: Create Android project
        working-directory: WEURA
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=weura --org com --no-pub

      - name: Restore pubspec
        working-directory: WEURA
        run: cp /tmp/pubspec.bak pubspec.yaml

      - name: Fix Android config
        working-directory: WEURA/android
        run: |
          sed -i 's|^\(\s*\)compileSdk = .*|\1compileSdk = 36|' app/build.gradle 2>/dev/null || true
          sed -i 's|^\(\s*\)compileSdkVersion .*|\1compileSdkVersion 36|' app/build.gradle 2>/dev/null || true
          sed -i 's|^\(\s*\)ndkVersion = .*|\1ndkVersion = "27.0.12077973"|' app/build.gradle 2>/dev/null || true
          sed -i 's|distributionUrl=.*gradle-[0-9.]*-all.zip|distributionUrl=https://services.gradle.org/distributions/gradle-8.9-all.zip|' gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          sed -i 's|^\(\s*\)minSdk = .*|\1minSdk = 24|' app/build.gradle 2>/dev/null || true
          sed -i 's|^\(\s*\)minSdkVersion .*|\1minSdkVersion 24|' app/build.gradle 2>/dev/null || true

          MANIFEST="app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <application|' "$MANIFEST"
          fi

      - name: Decode google-services.json
        working-directory: WEURA
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          ls -la android/app/google-services.json
          head -5 android/app/google-services.json

      - name: Fix settings.gradle plugins
        working-directory: WEURA/android
        run: |
          sed -i 's|id "org.jetbrains.kotlin.android" version "[^"]*"|id "org.jetbrains.kotlin.android" version "2.1.20"|' settings.gradle
          if ! grep -q 'com.google.gms.google-services' settings.gradle; then
            sed -i 's|id "org.jetbrains.kotlin.android" version "2.1.20" apply false|id "org.jetbrains.kotlin.android" version "2.1.20" apply false\n    id "com.google.gms.google-services" version "4.4.2" apply false|' settings.gradle
          fi
          echo "=== settings.gradle ==="
          cat settings.gradle

      - name: Apply Google Services plugin to app
        working-directory: WEURA/android/app
        run: |
          echo "=== BEFORE: app/build.gradle plugins block ==="
          head -25 build.gradle

          python3 << 'PYEOF2'
          with open('build.gradle', 'r') as f:
              content = f.read()

          if 'com.google.gms.google-services' in content:
              print('already present — skipping')
          else:
              # Try all common formats
              patterns = [
                  'id "dev.flutter.flutter-gradle-plugin"',
                  "id 'dev.flutter.flutter-gradle-plugin'",
                  'id("dev.flutter.flutter-gradle-plugin")',
              ]
              added = False
              for pat in patterns:
                  if pat in content:
                      content = content.replace(
                          pat,
                          pat + '\n    id "com.google.gms.google-services"',
                          1,
                      )
                      added = True
                      print(f'matched: {pat}')
                      break

              if not added:
                  # Fallback: add after first closing of plugins block
                  content = content.replace(
                      'plugins {',
                      'plugins {\n    id "com.google.gms.google-services"',
                      1,
                  )
                  print('fallback: added to plugins block top')

              with open('build.gradle', 'w') as f:
                  f.write(content)
          PYEOF2

          echo "=== AFTER: app/build.gradle plugins block ==="
          head -25 build.gradle

      - name: Get dependencies
        working-directory: WEURA
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: WEURA
        run: dart run flutter_launcher_icons || true

      - name: Re-apply Android config
        working-directory: WEURA/android
        run: |
          sed -i 's|^\(\s*\)compileSdk = .*|\1compileSdk = 36|' app/build.gradle 2>/dev/null || true
          sed -i 's|^\(\s*\)minSdk = .*|\1minSdk = 24|' app/build.gradle 2>/dev/null || true

          # Bump Android Gradle Plugin to 8.7.2+ (required by webkit 1.14)
          if [ -f settings.gradle ]; then
            sed -i 's|com.android.application.*version "[0-9.]*"|com.android.application\" version \"8.7.2\"|' settings.gradle
            sed -i 's|com.android.library.*version "[0-9.]*"|com.android.library\" version \"8.7.2\"|' settings.gradle
            echo "=== settings.gradle after AGP bump ==="
            cat settings.gradle
          fi
          MANIFEST="app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <application|' "$MANIFEST"
          fi

          # ─── Disable Impeller (fixes glitches on Mali GPUs) ───
          if ! grep -q 'EnableImpeller' "$MANIFEST"; then
            sed -i 's|<application|<meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n    <application|' "$MANIFEST"
          fi

      - name: Decode keystore
        working-directory: WEURA
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/weura-release.jks
          ls -la android/app/weura-release.jks

      - name: Create key.properties
        working-directory: WEURA/android
        run: |
          cat > key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=weura-release.jks
          EOF
          echo "key.properties created"

      - name: Configure signing in build.gradle
        working-directory: WEURA/android/app
        run: |
          # Insert signing config block before 'buildTypes'
          python3 << 'PYEOF2'
          import re
          path = 'build.gradle'
          with open(path, 'r') as f:
              content = f.read()

          if 'signingConfigs' in content:
              print('signingConfigs already present')
          else:
              signing_block = '''    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
              '''
              # Load key.properties at top
              props_loader = '''def keystoreProperties = new Properties()
              def keystorePropertiesFile = rootProject.file('key.properties')
              if (keystorePropertiesFile.exists()) {
                  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
              }

              '''
              # Prepend props loader after plugins block
              content = content.replace('android {', props_loader + 'android {', 1)
              # Insert signingConfigs after 'android {'
              content = content.replace('android {', 'android {\n' + signing_block, 1)
              # Replace buildTypes release config
              content = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  content,
                  count=1,
              )
              with open(path, 'w') as f:
                  f.write(content)
              print('signingConfigs injected')
          PYEOF2

      - name: Build APK
        working-directory: WEURA
        run: flutter build apk --release --target=app/main.dart

      - name: Get APK size
        id: apk
        working-directory: WEURA
        run: |
          SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "APK size: $SIZE"

      - name: Get commit short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: "WEURA Build ${{ steps.sha.outputs.short }}"
          body: |
            Auto-built APK from commit ${{ steps.sha.outputs.short }}

            **Size:** ${{ steps.apk.outputs.size }}
            **Date:** ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}

            ### Install
            1. Download `app-release.apk` below
            2. Open it on your Android phone
            3. Allow installation from unknown sources if prompted
          files: WEURA/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases (keep latest 3)
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
