name: Build WEURA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Bump Kotlin + compileSdk + minSdk
        working-directory: WEURA/android
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/' settings.gradle 2>/dev/null || true
          sed -i 's/^\( *\)compileSdk = .*/\1compileSdk = 36/' app/build.gradle 2>/dev/null || true
          sed -i 's/^\( *\)compileSdkVersion .*/\1compileSdkVersion 36/' app/build.gradle 2>/dev/null || true
          sed -i 's/^\( *\)minSdk = .*/\1minSdk = 24/' app/build.gradle 2>/dev/null || true
          sed -i 's/^\( *\)minSdkVersion .*/\1minSdkVersion 24/' app/build.gradle 2>/dev/null || true

          if ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml 2>/dev/null; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' app/src/main/AndroidManifest.xml 2>/dev/null || true
          fi

          echo "=== settings.gradle ==="
          cat settings.gradle | grep -i kotlin || true
          echo ""
          echo "=== app/build.gradle (sdk) ==="
          grep -E 'compileSdk|minSdk' app/build.gradle || true

      - name: Get dependencies
        working-directory: WEURA
        run: flutter pub get

      - name: Verify assets
        working-directory: WEURA
        run: |
          echo "=== pubspec.yaml (flutter section) ==="
          sed -n '/^flutter:/,$p' pubspec.yaml
          echo ""
          echo "=== assets/icons/ ==="
          ls assets/icons/ | head -20
          echo ""
          echo "=== assets/logo/ ==="
          ls assets/logo/ 2>/dev/null || echo "MISSING"

      - name: Build Universal APK
        working-directory: WEURA
        run: flutter build apk --release --target=app/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weura-apk
          path: WEURA/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30