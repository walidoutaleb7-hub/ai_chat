name: Build WEURA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WEURA Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.4"
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Repair Android project
        working-directory: WEURA
        run: |
          set -e
          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "Creating Android project scaffolding..."
            rm -rf /tmp/weura_backup
            mkdir -p /tmp/weura_backup
            cp -r app /tmp/weura_backup/app
            cp pubspec.yaml /tmp/weura_backup/pubspec.yaml
            flutter create --platforms=android --project-name=weura --org=com.walidout.weura .
            rm -rf app
            cp -r /tmp/weura_backup/app app
            cp /tmp/weura_backup/pubspec.yaml pubspec.yaml
          else
            echo "Android project already exists."
          fi
          rm -f test/widget_test.dart

      - name: Fix Kotlin plugin repository
        working-directory: WEURA
        run: |
          set -e

          SETTINGS_KTS="android/settings.gradle.kts"
          SETTINGS_GROOVY="android/settings.gradle"

          if [ -f "$SETTINGS_KTS" ]; then
            echo "=== Patching settings.gradle.kts ==="

            # Add mavenCentral + google to pluginManagement repositories
            if ! grep -q "mavenCentral()" "$SETTINGS_KTS"; then
              # Insert repositories block after pluginManagement {
              sed -i '/pluginManagement {/a\
                repositories {\
                    google()\
                    mavenCentral()\
                    gradlePluginPortal()\
                }' "$SETTINGS_KTS"
            fi

            # Also add google() and mavenCentral() to dependencyResolutionManagement
            if ! grep -q "dependencyResolutionManagement" "$SETTINGS_KTS"; then
              echo "No dependencyResolutionManagement block found, adding one..."
              cat >> "$SETTINGS_KTS" << 'EOF'

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
            fi

            echo "=== Result ==="
            cat "$SETTINGS_KTS"

          elif [ -f "$SETTINGS_GROOVY" ]; then
            echo "=== Patching settings.gradle (Groovy) ==="

            if ! grep -q "mavenCentral()" "$SETTINGS_GROOVY"; then
              sed -i '/pluginManagement {/a\
                repositories {\
                    google()\
                    mavenCentral()\
                    gradlePluginPortal()\
                }' "$SETTINGS_GROOVY"
            fi

            echo "=== Result ==="
            cat "$SETTINGS_GROOVY"
          fi

      - name: Fix Android SDK versions
        working-directory: WEURA
        run: |
          set -e

          GRADLE_KTS="android/app/build.gradle.kts"
          GRADLE_GROOVY="android/app/build.gradle"

          if [ -f "$GRADLE_KTS" ]; then
            echo "=== Patching build.gradle.kts ==="

            sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' "$GRADLE_KTS"
            sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdk = 36/' "$GRADLE_KTS"
            sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 24/' "$GRADLE_KTS"
            sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdk = 24/' "$GRADLE_KTS"
            sed -i 's/ndkVersion = flutter\.ndkVersion/ndkVersion = "27.0.12077973"/' "$GRADLE_KTS"

            if ! grep -q "ndkVersion" "$GRADLE_KTS"; then
              sed -i '/compileSdk = 36/a\    ndkVersion = "27.0.12077973"' "$GRADLE_KTS"
            fi

            echo "=== Result ==="
            cat "$GRADLE_KTS"

          elif [ -f "$GRADLE_GROOVY" ]; then
            echo "=== Patching build.gradle (Groovy) ==="

            sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' "$GRADLE_GROOVY"
            sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 24/' "$GRADLE_GROOVY"
            sed -i 's/ndkVersion flutter\.ndkVersion/ndkVersion "27.0.12077973"/' "$GRADLE_GROOVY"

            echo "=== Result ==="
            cat "$GRADLE_GROOVY"
          fi

          echo ""
          echo "=== Checking AndroidManifest for uses-sdk ==="
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if grep -q "uses-sdk" "$MANIFEST"; then
              echo "Found uses-sdk — removing it..."
              sed -i '/<uses-sdk/d' "$MANIFEST"
            else
              echo "No uses-sdk line — OK."
            fi
          fi

      - name: Fix icon assets structure
        working-directory: WEURA
        run: |
          set -e
          mkdir -p assets/icons
          for f in assets/logo/*.svg; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            if [ "$name" != "weura.svg" ]; then
              if [ ! -f "assets/icons/$name" ]; then
                mv "$f" "assets/icons/$name"
              else
                rm -f "$f"
              fi
            fi
          done
          echo "assets/icons:"
          ls -la assets/icons
          echo "assets/logo:"
          ls -la assets/logo

      - name: Patch AndroidManifest permissions
        working-directory: WEURA
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest not found!"
            exit 1
          fi

          if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>|' "$MANIFEST"
          fi
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.INTERNET"/>|' "$MANIFEST"
          fi
          if ! grep -q "android.permission.BLUETOOTH_CONNECT" "$MANIFEST"; then
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.BLUETOOTH"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>|' "$MANIFEST"
          fi
          if ! grep -q "WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>|' "$MANIFEST"
          fi
          if ! grep -q "android.speech.RecognitionService" "$MANIFEST"; then
            sed -i 's|<application|    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n\n    <application|' "$MANIFEST"
          fi

          echo "=== Final Manifest ==="
          cat "$MANIFEST"

      - name: Install dependencies
        working-directory: WEURA
        run: flutter pub get

      - name: Generate app launcher icons
        working-directory: WEURA
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: WEURA
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK (debug)
        working-directory: WEURA
        run: |
          flutter clean
          flutter pub get
          flutter build apk --debug --target=app/main.dart

      - name: Verify APK
        working-directory: WEURA
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WEURA-APK-${{ github.run_number }}
          path: WEURA/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14