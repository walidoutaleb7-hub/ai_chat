name: Build WEURA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build WEURA Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Inspect WEURA project
        working-directory: WEURA
        run: |
          echo "=== WEURA ROOT ==="
          ls -la

          echo ""
          echo "=== Android ==="
          if [ -d "android" ]; then
            find android -maxdepth 2 -type f | sort
          else
            echo "android/ does not exist"
          fi

      - name: Repair Android project
        working-directory: WEURA
        run: |
          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "Android project is missing or unsupported."
            echo "Creating a modern Flutter Android project..."

            rm -rf /tmp/weura_backup
            mkdir -p /tmp/weura_backup

            # Backup WEURA Dart application.
            cp -r app /tmp/weura_backup/app

            # Backup the existing pubspec.
            cp pubspec.yaml /tmp/weura_backup/pubspec.yaml

            # Generate a modern Flutter Android project.
            flutter create \
              --platforms=android \
              --project-name=weura \
              --org=com.walidout.weura \
              .

            # Restore the WEURA application structure.
            rm -rf app
            cp -r /tmp/weura_backup/app app

            # Restore the WEURA dependency configuration.
            cp /tmp/weura_backup/pubspec.yaml pubspec.yaml

            echo "Modern Android project created."
          else
            echo "Android project already exists."
            echo "Keeping the existing Android project."
          fi

          # The generated Flutter project may contain the default
          # widget test referencing package:weura/main.dart and MyApp.
          # WEURA uses app/main.dart instead.
          rm -f test/widget_test.dart

          echo ""
          echo "=== Final Android check ==="
          ls -la android

      - name: Install dependencies
        working-directory: WEURA
        run: |
          flutter pub get

      - name: Analyze
        working-directory: WEURA
        run: |
          flutter analyze

      - name: Build APK
        working-directory: WEURA
        run: |
          flutter build apk \
            --debug \
            --target=app/main.dart

      - name: Verify APK
        working-directory: WEURA
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WEURA-APK
          path: WEURA/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error