name: Build WEURA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Regenerate Android project
        working-directory: WEURA
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=weura --org com.weura

      - name: Fix Android build config
        working-directory: WEURA/android
        run: |
          # Bump Kotlin (reads metadata 2.2.0)
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/' settings.gradle

          # Bump compileSdk to 36 (flutter_tts requires it)
          sed -i 's/^\( *\)compileSdk = .*/\1compileSdk = 36/' app/build.gradle
          sed -i 's/^\( *\)compileSdkVersion .*/\1compileSdkVersion 36/' app/build.gradle

          # Bump minSdk to 24 (flutter_tts requires it)
          sed -i 's/^\( *\)minSdk = .*/\1minSdk = 24/' app/build.gradle
          sed -i 's/^\( *\)minSdkVersion .*/\1minSdkVersion 24/' app/build.gradle

          # Show the result for debugging
          echo "=== settings.gradle (kotlin) ==="
          grep kotlin settings.gradle || true
          echo "=== build.gradle (sdk) ==="
          grep -E 'compileSdk|minSdk' app/build.gradle || true

      - name: Get dependencies
        working-directory: WEURA
        run: flutter pub get

      - name: Build APK
        working-directory: WEURA
        run: flutter build apk --release --split-per-abi --target=app/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weura-apk
          path: WEURA/build/app/outputs/flutter-apk/*.apk
          retention-days: 30