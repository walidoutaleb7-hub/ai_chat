name: Build WEURA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Backup pubspec.yaml
        working-directory: WEURA
        run: cp pubspec.yaml /tmp/pubspec.yaml.bak

      - name: Regenerate Android project
        working-directory: WEURA
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=weura --org com.weura

      - name: Restore pubspec.yaml
        working-directory: WEURA
        run: cp /tmp/pubspec.yaml.bak pubspec.yaml

      - name: Ensure assets exist
        working-directory: WEURA
        run: |
          mkdir -p assets/logo
          # Copy files that the app looks for under assets/logo/
          if [ -f assets/icons/app_icon.png ]; then
            cp assets/icons/app_icon.png assets/logo/app_icon.png
          fi
          if [ -f assets/icons/weura.svg ]; then
            cp assets/icons/weura.svg assets/logo/weura.svg
          fi

          echo "=== pubspec.yaml (flutter section) ==="
          sed -n '/^flutter:/,$p' pubspec.yaml
          echo ""
          echo "=== assets/icons/ ==="
          ls -la assets/icons/ || true
          echo ""
          echo "=== assets/logo/ ==="
          ls -la assets/logo/ || true

      - name: Fix Android config
        working-directory: WEURA/android
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/' settings.gradle
          sed -i 's/^\( *\)compileSdk = .*/\1compileSdk = 36/' app/build.gradle
          sed -i 's/^\( *\)minSdk = .*/\1minSdk = 24/' app/build.gradle
          if ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' app/src/main/AndroidManifest.xml
          fi

      - name: Get dependencies
        working-directory: WEURA
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: WEURA
        run: dart run flutter_launcher_icons || true

      - name: Re-apply Android config after icons
        working-directory: WEURA/android
        run: |
          sed -i 's/^\( *\)compileSdk = .*/\1compileSdk = 36/' app/build.gradle
          sed -i 's/^\( *\)minSdk = .*/\1minSdk = 24/' app/build.gradle
          if ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' app/src/main/AndroidManifest.xml
          fi

      - name: Build Universal APK
        working-directory: WEURA
        run: flutter build apk --release --target=app/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weura-apk
          path: WEURA/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30