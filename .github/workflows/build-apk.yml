name: Build WEURA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Fix icon path
        working-directory: WEURA
        run: |
          mkdir -p assets/logo
          if [ -f assets/icons/app_icon.png ]; then
            cp assets/icons/app_icon.png assets/logo/app_icon.png
            echo "✅ Copied app_icon.png to assets/logo/"
          else
            echo "❌ app_icon.png NOT FOUND in assets/icons/"
            ls -la assets/icons/ | head -20
          fi

      - name: Regenerate Android project
        working-directory: WEURA
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=weura --org com.weura

      - name: Fix Android config
        working-directory: WEURA/android
        run: |
          # Kotlin version (reads metadata 2.2.0)
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/' settings.gradle

          # compileSdk 36 + minSdk 24
          sed -i 's/^\( *\)compileSdk = .*/\1compileSdk = 36/' app/build.gradle
          sed -i 's/^\( *\)minSdk = .*/\1minSdk = 24/' app/build.gradle

          # INTERNET permission
          if ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' app/src/main/AndroidManifest.xml
          fi

          echo "=== Manifest permissions ==="
          grep -E 'uses-permission|<application' app/src/main/AndroidManifest.xml || true

      - name: Get dependencies
        working-directory: WEURA
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: WEURA
        run: dart run flutter_launcher_icons

      - name: Re-apply Android config after icons
        working-directory: WEURA/android
        run: |
          sed -i 's/^\( *\)compileSdk = .*/\1compileSdk = 36/' app/build.gradle
          sed -i 's/^\( *\)minSdk = .*/\1minSdk = 24/' app/build.gradle
          if ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' app/src/main/AndroidManifest.xml
          fi

      - name: Build Universal APK
        working-directory: WEURA
        run: flutter build apk --release --target=app/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weura-apk
          path: WEURA/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30