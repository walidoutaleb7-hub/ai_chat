name: Build WEURA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Install dependencies
        working-directory: WEURA
        run: flutter pub get

      - name: Analyze
        working-directory: WEURA
        run: flutter analyze

      - name: Build APK
        working-directory: WEURA
        run: flutter build apk --debug --target=app/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WEURA-APK
          path: WEURA/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error