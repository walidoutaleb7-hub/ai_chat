name: Build WEURA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build WEURA Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Repair Android project
        working-directory: WEURA
        run: |
          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "Creating Android project..."
            rm -rf /tmp/weura_backup
            mkdir -p /tmp/weura_backup
            cp -r app /tmp/weura_backup/app
            cp pubspec.yaml /tmp/weura_backup/pubspec.yaml
            flutter create --platforms=android --project-name=weura --org=com.walidout.weura .
            rm -rf app
            cp -r /tmp/weura_backup/app app
            cp /tmp/weura_backup/pubspec.yaml pubspec.yaml
          else
            echo "Android project exists."
          fi
          rm -f test/widget_test.dart

      - name: Fix icon assets structure
        working-directory: WEURA
        run: |
          mkdir -p assets/icons
          for f in assets/logo/*.svg; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            if [ "$name" != "weura.svg" ]; then
              mv "$f" "assets/icons/$name"
            fi
          done
          echo "assets/icons:"
          ls -la assets/icons
          echo "assets/logo:"
          ls -la assets/logo

      - name: Patch AndroidManifest
        working-directory: WEURA
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest not found!"
            exit 1
          fi

          # Add permissions
          if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>|' "$MANIFEST"
          fi
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.INTERNET"/>|' "$MANIFEST"
          fi
          if ! grep -q "android.permission.BLUETOOTH" "$MANIFEST"; then
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.BLUETOOTH"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>|' "$MANIFEST"
          fi
          if ! grep -q "WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
            sed -i 's|<manifest[^>]*>|&\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>|' "$MANIFEST"
          fi

          # Add queries for speech recognition
          if ! grep -q "android.speech.RecognitionService" "$MANIFEST"; then
            sed -i 's|<application|    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n\n    <application|' "$MANIFEST"
          fi

          echo "=== Final Manifest ==="
          cat "$MANIFEST"

      - name: Install dependencies
        working-directory: WEURA
        run: flutter pub get

      - name: Generate app launcher icons
        working-directory: WEURA
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: WEURA
        run: flutter analyze
        continue-on-error: true

      - name: Build APK
        working-directory: WEURA
        run: flutter build apk --debug --target=app/main.dart

      - name: Verify APK
        working-directory: WEURA
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WEURA-APK
          path: WEURA/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
