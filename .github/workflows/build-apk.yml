name: Build WEURA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Regenerate Android project
        working-directory: WEURA
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=weura --org com.weura

      - name: Fix Android config
        working-directory: WEURA/android
        run: |
          # 1) Bump Kotlin
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.0"/' settings.gradle

          # 2) compileSdk 36 + minSdk 24
          sed -i 's/^\( *\)compileSdk = .*/\1compileSdk = 36/' app/build.gradle
          sed -i 's/^\( *\)minSdk = .*/\1minSdk = 24/' app/build.gradle

          # 3) ⚡ ADD INTERNET PERMISSION (this was missing!)
          if ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' app/src/main/AndroidManifest.xml
          fi

          # 4) Show the results
          echo "=== AndroidManifest (permissions) ==="
          grep -E 'uses-permission|<application' app/src/main/AndroidManifest.xml || true

      - name: Get dependencies
        working-directory: WEURA
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: WEURA
        run: dart run flutter_launcher_icons || true

      - name: Re-apply Android config after icons
        working-directory: WEURA/android
        run: |
          sed -i 's/^\( *\)compileSdk = .*/\1compileSdk = 36/' app/build.gradle
          sed -i 's/^\( *\)minSdk = .*/\1minSdk = 24/' app/build.gradle
          if ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' app/src/main/AndroidManifest.xml
          fi

      - name: Build APK
        working-directory: WEURA
        run: flutter build apk --release --split-per-abi --target=app/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weura-apk
          path: WEURA/build/app/outputs/flutter-apk/*.apk
          retention-days: 30