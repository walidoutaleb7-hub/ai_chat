name: Build WEURA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build WEURA Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Inspect WEURA project
        working-directory: WEURA
        run: |
          echo "=== WEURA ROOT ==="
          ls -la

          echo ""
          echo "=== Android ==="
          if [ -d "android" ]; then
            find android -maxdepth 2 -type f | sort
          else
            echo "android/ does not exist"
          fi

      - name: Repair Android project
        working-directory: WEURA
        run: |
          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "Android project is missing or unsupported."
            echo "Creating a modern Flutter Android project..."

            rm -rf /tmp/weura_backup
            mkdir -p /tmp/weura_backup

            cp -r app /tmp/weura_backup/app
            cp pubspec.yaml /tmp/weura_backup/pubspec.yaml

            flutter create \
              --platforms=android \
              --project-name=weura \
              --org=com.walidout.weura \
              .

            rm -rf app
            cp -r /tmp/weura_backup/app app

            cp /tmp/weura_backup/pubspec.yaml pubspec.yaml

            echo "Modern Android project created."
          else
            echo "Android project already exists."
            echo "Keeping the existing Android project."
          fi

          rm -f test/widget_test.dart

          echo ""
          echo "=== Final Android check ==="
          ls -la android

      - name: Fix icon assets structure
        working-directory: WEURA
        run: |
          echo "=== BEFORE ==="
          echo "assets/icons:"
          ls -la assets/icons 2>/dev/null || echo "  (empty or missing)"
          echo "assets/logo:"
          ls -la assets/logo

          mkdir -p assets/icons

          # Move every SVG from assets/logo/ to assets/icons/
          # EXCEPT weura.svg which must stay in assets/logo/
          for f in assets/logo/*.svg; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            if [ "$name" != "weura.svg" ]; then
              mv "$f" "assets/icons/$name"
            fi
          done

          echo ""
          echo "=== AFTER ==="
          echo "assets/icons:"
          ls -la assets/icons
          echo "assets/logo:"
          ls -la assets/logo

      - name: Install dependencies
        working-directory: WEURA
        run: |
          flutter pub get

      - name: Analyze
        working-directory: WEURA
        run: |
          flutter analyze
        continue-on-error: true

      - name: Build APK
        working-directory: WEURA
        run: |
          flutter build apk \
            --debug \
            --target=app/main.dart

      - name: Verify APK
        working-directory: WEURA
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WEURA-APK
          path: WEURA/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error