name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Create Android project in subfolder only
        working-directory: WEURA
        run: |
          rm -rf android
          flutter create --platforms=android --project-name=weura --org com.weura --no-pub android

      - name: Verify pubspec untouched
        working-directory: WEURA
        run: |
          echo "=== pubspec.yaml (flutter section) ==="
          sed -n '/^flutter:/,$p' pubspec.yaml
          echo ""
          echo "=== assets/icons/ ==="
          ls assets/icons/ | head -5
          echo ""
          echo "=== assets/logo/ ==="
          ls assets/logo/ | head -5

      - name: Fix Android config
        working-directory: WEURA/android
        run: |
          echo "=== BEFORE ==="
          grep -nE 'compileSdk|minSdk|kotlin' app/build.gradle settings.gradle || true
          echo ""

          # Kotlin version (whole version match)
          sed -i 's|version "[0-9][0-9.]*"|version "2.1.0"|' settings.gradle 2>/dev/null || true

          # compileSdk: match ENTIRE line after "compileSdk = " or "compileSdkVersion "
          sed -i 's|^\(\s*\)compileSdk = .*|\1compileSdk = 36|' app/build.gradle 2>/dev/null || true
          sed -i 's|^\(\s*\)compileSdkVersion .*|\1compileSdkVersion 36|' app/build.gradle 2>/dev/null || true

          # minSdk: same approach
          sed -i 's|^\(\s*\)minSdk = .*|\1minSdk = 24|' app/build.gradle 2>/dev/null || true
          sed -i 's|^\(\s*\)minSdkVersion .*|\1minSdkVersion 24|' app/build.gradle 2>/dev/null || true

          # INTERNET permission
          if ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml 2>/dev/null; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' app/src/main/AndroidManifest.xml 2>/dev/null || true
          fi

          echo "=== AFTER ==="
          grep -nE 'compileSdk|minSdk|kotlin' app/build.gradle settings.gradle || true

      - name: Get dependencies
        working-directory: WEURA
        run: flutter pub get

      - name: Build APK
        working-directory: WEURA
        run: flutter build apk --release --target=app/main.dart

      - uses: actions/upload-artifact@v4
        with:
          name: weura-apk
          path: WEURA/build/app/outputs/flutter-apk/app-release.apk