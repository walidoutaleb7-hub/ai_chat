name: WEURA AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} > pr.diff || true

          if [ ! -s pr.diff ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Cap diff size to avoid huge payloads.
          SIZE=$(wc -c < pr.diff)
          echo "Diff size: $SIZE bytes"

          if [ "$SIZE" -gt 80000 ]; then
            head -c 80000 pr.diff > pr.diff.trimmed
            echo "" >> pr.diff.trimmed
            echo "[... diff truncated at 80KB ...]" >> pr.diff.trimmed
            mv pr.diff.trimmed pr.diff
          fi

          echo "empty=false" >> "$GITHUB_OUTPUT"

      - name: Skip if diff is empty
        if: steps.diff.outputs.empty == 'true'
        run: |
          echo "No changes to review."
          exit 0

      - name: Ask Groq to review
        id: groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY secret is not set. Skipping review."
            exit 0
          fi

          DIFF=$(cat pr.diff)

          # Build JSON payload using jq (safe encoding).
          jq -n \
            --arg diff "$DIFF" \
            '{
              model: "openai/gpt-oss-120b",
              temperature: 0.2,
              max_tokens: 1200,
              messages: [
                {
                  role: "system",
                  content: "You are a senior code reviewer for the WEURA AI project (Flutter + Node/TypeScript). Review the diff for: bugs, security issues, performance problems, regressions, and code quality. Focus on concrete findings. Format the response as Markdown with sections: ## Summary, ## Issues (if any), ## Suggestions (if any). Be concise. Do not invent problems. If the diff looks good, say so briefly."
                },
                {
                  role: "user",
                  content: ("Review this pull request diff:\n\n" + $diff)
                }
              ]
            }' > payload.json

          HTTP=$(curl -s -o response.json -w "%{http_code}" \
            --max-time 60 \
            -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -d @payload.json)

          echo "Groq HTTP: $HTTP"

          if [ "$HTTP" != "200" ]; then
            echo "Groq request failed. Body:"
            cat response.json
            exit 1
          fi

          jq -r '.choices[0].message.content // ""' response.json > review.md

          if [ ! -s review.md ]; then
            echo "Empty review response."
            exit 1
          fi

          echo "--- Review ---"
          cat review.md

      - name: Post review comment
        if: steps.groq.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 🤖 WEURA AI Review"
            echo ""
            cat review.md
            echo ""
            echo "---"
            echo "_Generated automatically for PR #${{ github.event.pull_request.number }}._"
          } > comment.md

          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file comment.md

      - name: Cleanup
        if: always()
        run: |
          rm -f pr.diff response.json payload.json review.md comment.md || true