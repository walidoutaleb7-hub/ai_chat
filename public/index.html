<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEURA AI — Think Beyond</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">W</div>
            <h1>WEURA AI</h1>
            <p>Think Beyond.</p>
        </div>
    </div>

    <!-- App Container -->
    <div id="app" class="app-container hidden">
        <!-- Sidebar Drawer -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="btn-primary-new">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Chat
                </button>
                <button id="sidebar-close" class="icon-btn mobile-only">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <div class="chat-history-list" id="chat-history-list">
                <!-- Dynamic History injected here -->
            </div>

            <div class="sidebar-footer">
                <button id="settings-btn" class="nav-item-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Settings
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-content">
            <header class="topbar">
                <button id="sidebar-toggle" class="icon-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="brand-title">WEURA AI <span>Think Beyond</span></div>
                <div class="topbar-modes">
                    <select id="mode-selector" class="mode-select">
                        <option value="auto">Auto</option>
                        <option value="smart">Smart</option>
                        <option value="research">Research</option>
                        <option value="code">Code</option>
                        <option value="creative">Creative</option>
                        <option value="vision">Vision</option>
                        <option value="fast">Fast</option>
                    </select>
                </div>
            </header>

            <div class="chat-viewport" id="chat-viewport">
                <div class="welcome-banner" id="welcome-banner">
                    <h1>WEURA AI</h1>
                    <p>Think Beyond.</p>
                </div>
                <div class="messages-container" id="messages-container"></div>
            </div>

            <!-- Composer Area -->
            <div class="composer-wrapper">
                <div class="composer-box">
                    <div id="attachment-preview" class="attachment-preview hidden"></div>
                    <textarea id="user-input" rows="1" placeholder="Ask anything..."></textarea>
                    <div class="composer-tools">
                        <div class="tool-actions">
                            <button id="file-btn" class="icon-btn" title="Upload File">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                            </button>
                            <input type="file" id="file-input" class="hidden" accept=".txt,.pdf,.docx,.xlsx,.png,.jpg,.jpeg">
                            
                            <button id="camera-btn" class="icon-btn" title="Camera">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                            </button>
                            
                            <button id="mic-btn" class="icon-btn" title="Microphone">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                            </button>
                        </div>
                        <button id="send-btn" class="send-action-btn" title="Send">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="settings-close" class="icon-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <label>Language</label>
                    <select id="lang-select">
                        <option value="en">English (LTR)</option>
                        <option value="ar">العربية (RTL)</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Response Detail</label>
                    <select id="detail-select">
                        <option value="balanced">Balanced</option>
                        <option value="concise">Concise</option>
                        <option value="detailed">Detailed</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Privacy & Data</label>
                    <button id="clear-data-btn" class="btn-danger">Clear Local Data</button>
                </div>
                <div class="about-section">
                    <h3>WEURA AI</h3>
                    <p>Think Beyond.</p>
                    <p class="author">Developed by Walid Out — وليد</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
