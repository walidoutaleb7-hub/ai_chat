<svg width="24" height="24" viewBox="0 0 24 24"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="blueGlow"
            x="-80%" y="-80%"
            width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#3B82F6"
               flood-opacity="0.75"
               result="glowColor"/>
      <feComposite in="glowColor"
                   in2="blur"
                   operator="in"
                   result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="weuraBlue"
                    x1="5"
                    y1="20"
                    x2="19"
                    y2="4"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <g filter="url(#blueGlow)"
     stroke="url(#weuraBlue)"
     stroke-width="1.8"
     stroke-linecap="round"
     stroke-linejoin="round">

    <path d="M7 3.5H14L19 8.5V20.5H7C5.9 20.5 5 19.6 5 18.5V5.5C5 4.4 5.9 3.5 7 3.5Z"/>

    <path d="M14 3.5V8.5H19"/>

    <path d="M8.5 12H15.5"/>

    <path d="M8.5 15.5H15.5"/>

    <path d="M8.5 8.5H10.5"/>

  </g>
</svg>