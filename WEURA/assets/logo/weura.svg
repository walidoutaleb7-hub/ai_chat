<svg width="512" height="512" viewBox="0 0 512 512" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="512" height="512" rx="128" fill="#05060A"/>

  <defs>
    <linearGradient id="weuraGradient"
      x1="96" y1="80" x2="416" y2="432"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D8DFF"/>
      <stop offset="0.5" stop-color="#315DFF"/>
      <stop offset="1" stop-color="#172D9A"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- WEURA symbol -->
  <path
    d="M128 144
       L178 368
       L256 220
       L334 368
       L384 144"
    stroke="url(#weuraGradient)"
    stroke-width="42"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <path
    d="M128 144
       L178 368
       L256 220
       L334 368
       L384 144"
    stroke="white"
    stroke-opacity="0.92"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    cx="256"
    cy="220"
    r="15"
    fill="white"
  />

</svg>
