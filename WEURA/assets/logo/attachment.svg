<svg width="24" height="24" viewBox="0 0 24 24"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="blueGlow"
            x="-80%" y="-80%"
            width="260%" height="260%">
      <feGaussianBlur
        stdDeviation="1.5"
        result="blur"/>
      <feFlood
        flood-color="#3B82F6"
        flood-opacity="0.75"
        result="glowColor"/>
      <feComposite
        in="glowColor"
        in2="blur"
        operator="in"
        result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="weuraBlue"
                    x1="5"
                    y1="19"
                    x2="19"
                    y2="5"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <path
    d="M9.2 14.8L15.7 8.3
       C17.2 6.8 19.6 6.8 21.1 8.3
       C22.6 9.8 22.6 12.2 21.1 13.7
       L13.1 21.7
       C10.1 24.7 5.2 24.7 2.2 21.7
       C-0.8 18.7 -0.8 13.8 2.2 10.8
       L10.7 2.3
       C13.1 -0.1 17 -0.1 19.4 2.3"
    transform="translate(1.2 0.3) scale(0.9)"
    stroke="url(#weuraBlue)"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#blueGlow)"/>

</svg>