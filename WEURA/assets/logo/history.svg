<svg width="24" height="24" viewBox="0 0 24 24"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="blueGlow"
            x="-80%" y="-80%"
            width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#3B82F6"
               flood-opacity="0.75"
               result="glowColor"/>
      <feComposite in="glowColor"
                   in2="blur"
                   operator="in"
                   result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="weuraBlue"
                    x1="4"
                    y1="20"
                    x2="20"
                    y2="4"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <g filter="url(#blueGlow)"
     stroke="url(#weuraBlue)"
     stroke-width="1.8"
     stroke-linecap="round"
     stroke-linejoin="round">

    <path d="M4.5 11.8C4.5 7.65 7.86 4.3 12 4.3C16.14 4.3 19.5 7.65 19.5 11.8C19.5 15.94 16.14 19.3 12 19.3C9.55 19.3 7.35 18.12 5.95 16.3"/>

    <path d="M4.5 6.7V11.8H9.6"/>

    <path d="M12 8V12L14.7 13.7"/>

  </g>
</svg>