<svg width="24" height="24" viewBox="0 0 24 24"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="blueGlow"
            x="-80%" y="-80%"
            width="260%" height="260%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur
        stdDeviation="1.6"
        result="blur"/>
      <feFlood
        flood-color="#3B82F6"
        flood-opacity="0.75"
        result="glowColor"/>
      <feComposite
        in="glowColor"
        in2="blur"
        operator="in"
        result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="weuraBlue"
                    x1="4"
                    y1="3"
                    x2="20"
                    y2="21"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.45" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <g filter="url(#blueGlow)"
     stroke="url(#weuraBlue)"
     stroke-width="1.8"
     stroke-linecap="round"
     stroke-linejoin="round">

    <path
      d="M12 15.5C14.2091 15.5 16 13.7091 16 11.5V6.5C16 4.29086 14.2091 2.5 12 2.5C9.79086 2.5 8 4.29086 8 6.5V11.5C8 13.7091 9.79086 15.5 12 15.5Z"/>

    <path
      d="M5 10.5V11.5C5 15.366 8.13401 18.5 12 18.5C15.866 18.5 19 15.366 19 11.5V10.5"/>

    <path d="M12 18.5V21.5"/>

    <path d="M9 21.5H15"/>

  </g>
</svg>