<svg width="24" height="24" viewBox="0 0 24 24"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="blueGlow"
            x="-80%" y="-80%"
            width="260%" height="260%">
      <feGaussianBlur
        stdDeviation="1.5"
        result="blur"/>
      <feFlood
        flood-color="#3B82F6"
        flood-opacity="0.75"
        result="glowColor"/>
      <feComposite
        in="glowColor"
        in2="blur"
        operator="in"
        result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="weuraBlue"
                    x1="4"
                    y1="20"
                    x2="20"
                    y2="4"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <g filter="url(#blueGlow)"
     stroke="url(#weuraBlue)"
     stroke-width="1.8"
     stroke-linecap="round"
     stroke-linejoin="round">

    <path d="M8 6.5L9.3 4.5H14.7L16 6.5H19C20.1 6.5 21 7.4 21 8.5V18C21 19.1 20.1 20 19 20H5C3.9 20 3 19.1 3 18V8.5C3 7.4 3.9 6.5 5 6.5H8Z"/>

    <circle cx="12" cy="13.2" r="3.4"/>

  </g>
</svg>