<svg width="24" height="24" viewBox="0 0 24 24"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="blueGlow"
            x="-80%" y="-80%"
            width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#3B82F6"
               flood-opacity="0.75"
               result="glowColor"/>
      <feComposite in="glowColor"
                   in2="blur"
                   operator="in"
                   result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="weuraBlue"
                    x1="4"
                    y1="20"
                    x2="20"
                    y2="4"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <g filter="url(#blueGlow)"
     stroke="url(#weuraBlue)"
     stroke-width="1.8"
     stroke-linecap="round"
     stroke-linejoin="round">

    <path d="M9.9 3.8L10.4 2.7H13.6L14.1 3.8L15.9 4.55L17 4L19.25 6.25L18.7 7.35L19.45 9.15L20.6 9.65V12.85L19.45 13.35L18.7 15.15L19.25 16.25L17 18.5L15.9 17.95L14.1 18.7L13.6 19.85H10.4L9.9 18.7L8.1 17.95L7 18.5L4.75 16.25L5.3 15.15L4.55 13.35L3.4 12.85V9.65L4.55 9.15L5.3 7.35L4.75 6.25L7 4L8.1 4.55L9.9 3.8Z"/>

    <circle cx="12" cy="11.25" r="3.1"/>

  </g>
</svg>