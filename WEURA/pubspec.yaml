name: weura
description: WEURA AI — Think Beyond.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── UI ─────────────────────────────────────────────
  flutter_svg: ^2.2.0

  # ─── Networking ─────────────────────────────────────
  http: ^1.5.0

  # ─── Markdown & Code ────────────────────────────────
  flutter_markdown_plus: ^1.0.4
  markdown: ^7.2.2
  flutter_highlight: ^0.7.0

  # ─── Local persistence ──────────────────────────────
  shared_preferences: ^2.3.2

  # ─── URL launching ──────────────────────────────────
  url_launcher: ^6.3.0

  # ─── Voice input (speech-to-text) ───────────────────
  speech_to_text: ^7.0.0

  # ─── Voice output (text-to-speech) ──────────────────
  flutter_tts: ^4.2.0

  # ─── Share assistant messages ───────────────────────
  share_plus: ^10.1.2

  # ─── Save generated images to gallery ───────────────
  gal: ^2.3.0

  # ─── Pick images from gallery / camera ──────────────
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ─── Auto-generate app icons ────────────────────────
  flutter_launcher_icons: ^0.14.1

# ─── App Launcher Icons Configuration ─────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#07070C"
  adaptive_icon_foreground: "assets/logo/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logo/
