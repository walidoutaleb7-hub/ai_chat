name: weura
description: WEURA AI — Think Beyond.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  flutter_svg: ^2.2.0

  # Networking
  http: ^1.5.0

  # Chat markdown rendering
  flutter_markdown_plus: ^1.0.4

  # Local persistence
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logo/
